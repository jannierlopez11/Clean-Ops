<script id="v92-menu-fix">
(function(){
  function installMenuFix(){
    const btn=document.getElementById('menuBtn');
    const drawer=document.getElementById('drawer');
    if(!btn || !drawer) return;

    // Remove the original inline handler so the repaired handler is authoritative.
    btn.onclick=null;

    const openMenu=function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      drawer.classList.add('open');
      drawer.style.display='';
      drawer.removeAttribute('aria-hidden');
    };

    btn.addEventListener('pointerup',openMenu,{passive:false});
    btn.addEventListener('touchend',openMenu,{passive:false});
    btn.addEventListener('click',openMenu);

    // Make the icon itself non-blocking and ensure the button is above the header.
    btn.style.pointerEvents='auto';
    btn.style.position='relative';
    btn.style.zIndex='10001';
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',installMenuFix);
  }else{
    installMenuFix();
  }
})();
</script>

   ${msg?`<div class="notice" style="margin-bottom:10px">${esc(msg)}</div>`:''}

function signupScreen(msg=''){
 $('loginView').innerHTML=`
 <div class="brand">CLEANING OPS</div>
 <p>${T('signup')}</p>
 <div class="card loginbox">
  ${msg?`<div class="notice" style="margin-bottom:10px">${esc(msg)}</div>`:''}
  <div class="field"><label>${T('name')}<input id="suName" autocomplete="name"></label></div>
  <div class="field"><label>${T('email')}<input id="suEmail" type="email" autocomplete="email"></label></div>

  <div class="field"><label>${T('confirm')}<input id="suConfirm" type="password" autocomplete="new-password"></label></div>

async function signup(){
 const name=$('suName')?.value.trim(),email=$('suEmail')?.value.trim(),pass=$('suPass')?.value,confirm=$('suConfirm')?.value;
 if(!name||!email||!pass)return signupScreen('Please complete every field.');
 if(pass.length<6)return signupScreen('Password must be at least 6 characters.');
 if(pass!==confirm)return signupScreen('Passwords do not match.');
 $('createBtn').disabled=true;
 const {data,error}=await supabase.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
 if(error){$('createBtn').disabled=false;return signupScreen(error.message)}
 if(data.session){session=data.session;await boot()}else loginScreen('Account created. Check your email to confirm, then sign in.');
}
async function signIn(){
 const email=$('email')?.value.trim(),password=$('password')?.value;
 if(!email||!password)return toast('Enter your email and password');
 $('loginBtn').disabled=true;
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error){$('loginBtn').disabled=false;return loginScreen(error.message)}
 session=data.session;await boot();
}
async function resetPassword(){
 const email=$('email')?.value.trim();if(!email)return toast('Enter your email first');
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 toast(error?error.message:'Password reset email sent');
}

async function boot(){
 const {data:{session:s}}=await supabase.auth.getSession();session=s;
 if(!session)return loginScreen();
 const {data:p,error}=await supabase.from('profiles').select('id,full_name,role,active,created_at').eq('id',session.user.id).single();
 if(error||!p)return loginScreen('Your account profile is not set up yet.');
 if(p.active===false){await supabase.auth.signOut();return loginScreen('This account is inactive.');}
 profile=p;
 await loadBase();
 renderShell();
 await showTab('home');
}

function todayRestaurant(){return restaurants.find(r=>r.weekday===new Date().getDay()&&r.active!==false)||null}

async function loadToday(){
 assignment=null;tasks=[];timeEntry=null;photos=[];
 const r=todayRestaurant();if(!r)return;
 let q=supabase.from('employee_assignments').select('*').eq('restaurant_id',r.id).eq('work_date',localDate());
 if(!isManagement())q=q.eq('employee_id',session.user.id);
 const {data:a,error}=await q.order('created_at',{ascending:true});
 if(error)return;
 assignment=isManagement()?(a||[])[0]:(a||[])[0];
 if(!assignment)return;
 const t=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
 tasks=t.data||[];
 if(!tasks.length){
   // Build today's checklist from the restaurant-specific configuration.
   const cfg=await supabase.from('restaurant_checklist_config').select('checklist_item_id,sort_order').eq('restaurant_id',r.id).eq('active',true).order('sort_order');
   const ids=(cfg.data||[]).map(x=>x.checklist_item_id).filter(Boolean);
   let names=[];
   if(ids.length){
     const ci=await supabase.from('checklist_items').select('id,name,description').in('id',ids).eq('active',true);
     const byId={};(ci.data||[]).forEach(x=>byId[x.id]=x);
     names=(cfg.data||[]).map(x=>byId[x.checklist_item_id]).filter(Boolean).map(x=>x.name);
   }
   // Bathrooms are mandatory on every service day.
   const rb=await supabase.from('restaurant_bathrooms').select('name,toilet_count,urinal_count,sink_count').eq('restaurant_id',r.id).eq('active',true).order('name');
   (rb.data||[]).forEach(b=>names.push(`Bathroom — ${b.name||'Bathroom'}`));
   if(names.length){
     await supabase.from('checklist_tasks').insert(names.map(name=>({assignment_id:assignment.id,task_name:name,completed:false})));
     const tt=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
     tasks=tt.data||[];
   }
 }
 if(!isManagement()){
   const te=await supabase.from('time_entries').select('id,clock_in,clock_out').eq('assignment_id',assignment.id).eq('employee_id',session.user.id).order('clock_in',{ascending:false}).limit(1);
   timeEntry=te.data?.[0]||null;
   const ph=await supabase.from('job_photos').select('id,employee_id,assignment_id,photo_type,storage_path,created_at').order('created_at',{ascending:false}).limit(200);
 const list=ph.data||[];
 const assignmentIds=[...new Set(list.map(p=>p.assignment_id).filter(Boolean))];
 let assignmentMap={};
 if(assignmentIds.length){
  const ar=await supabase.from('employee_assignments').select('id,restaurant_id,work_date').in('id',assignmentIds);
  (ar.data||[]).forEach(a=>assignmentMap[a.id]=a);
 }
 const restaurantMap={};
 restaurants.forEach(r=>restaurantMap[r.id]=r);
 const groups={};
 list.forEach(p=>{
  const a=assignmentMap[p.assignment_id];
  const r=a?restaurantMap[a.restaurant_id]:null;
  const date=a?.work_date || p.created_at?.slice(0,10) || 'Unknown date';
  const key=`${date}__${a?.restaurant_id||'unknown'}`;
  if(!groups[key]) groups[key]={date,restaurant:r?.name||'Unknown restaurant',photos:[]};
  groups[key].photos.push(p);
 });
 const groupKeys=Object.keys(groups).sort((a,b)=>groups[b].date.localeCompare(groups[a].date)||groups[a].restaurant.localeCompare(groups[b].restaurant));
 const cards=await Promise.all(groupKeys.map(async key=>{
  const g=groups[key];
  const byEmployee={};
  g.photos.forEach(p=>{const emp=employees.find(e=>e.id===p.employee_id)?.full_name||'Employee';if(!byEmployee[emp])byEmployee[emp]=[];byEmployee[emp].push(p)});
  const employeeBlocks=await Promise.all(Object.entries(byEmployee).sort((a,b)=>a[0].localeCompare(b[0])).map(async([emp,items])=>{
   const imgs=await Promise.all(items.map(async p=>{
    const signed=await supabase.storage.from('job-photos').createSignedUrl(p.storage_path,3600);
    return `<div><div class="tiny">${esc(p.photo_type==='before'?T('before'):T('after'))}</div>${signed.data?.signedUrl?`<img class="photo" style="margin-top:5px" src="${esc(signed.data.signedUrl)}" alt="${esc(p.photo_type)}">`:`<div class="empty" style="padding:10px">Photo unavailable</div>`}<div class="rowmeta" style="margin-top:4px">${new Date(p.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div></div>`;
   }));
   return `<div class="card" style="margin-top:9px"><div class="rowtitle">${esc(emp)}</div><div class="photoGrid" style="margin-top:8px">${imgs.join('')}</div></div>`;
  }));
  return `<div class="card" style="margin-top:12px"><div class="sectionhead"><div><div class="eyebrow">${esc(g.restaurant)}</div><h2 style="margin:3px 0 0">${new Date(g.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'})}</h2></div><div class="tiny">${g.photos.length} ${g.photos.length===1?'photo':'photos'}</div></div>${employeeBlocks.join('')}</div>`;
 }));
 $('content').innerHTML=`<div class="hero"><div class="eyebrow">${T('work')}</div><h1>${T('jobPhotos')}</h1><p>Organized by restaurant and service date.</p></div>${cards.join('')||`<div class="card"><div class="empty">No job photos yet.</div></div>`}`;

}

async function uploadPhotos(){
 if(!assignment)return toast('No assignment');
 const before=$('beforeFile')?.files?.[0],after=$('afterFile')?.files?.[0];
 if(!before&&!after)return toast('Choose a photo');
 for(const [type,file] of [['before',before],['after',after]]){
  if(!file)continue;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${session.user.id}/${assignment.id}/${type}-${Date.now()}.${ext}`;
  const up=await supabase.storage.from('job-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(up.error)return toast(up.error.message);
  const rec=await supabase.from('job_photos').insert({assignment_id:assignment.id,employee_id:session.user.id,photo_type:type,storage_path:path});
  if(rec.error)return toast(rec.error.message);
  await supabase.from('notifications').insert({type:'photo_uploaded',title:`${type} photo uploaded`,body:`${profile.full_name||'Employee'} uploaded a ${type} photo.`,related_id:assignment.id});
 }
 toast('Photos uploaded');await renderWork();
}

<script id="v911-work-history-js">
(function(){
 const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'}):'—';
 const time=s=>s?new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
 const mins=n=>n?`${Math.floor(n/60)}h ${n%60}m`:'—';
 const dur=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/60000)):0;
 window.renderHistory=async function(){
  if(!isManagement())return;
  const [aa,tt,pp,ss]=await Promise.all([
   supabase.from('employee_assignments').select('id,employee_id,restaurant_id,work_date,status').order('work_date',{ascending:false}).limit(500),
   supabase.from('time_entries').select('id,assignment_id,employee_id,clock_in,clock_out').order('clock_in',{ascending:false}).limit(1000),
   supabase.from('job_photos').select('id,assignment_id,employee_id,photo_type,storage_path,created_at').order('created_at',{ascending:false}).limit(1000),
   supabase.from('completion_signatures').select('*').order('created_at',{ascending:false}).limit(1000)
  ]);
  if(aa.error){$('content').innerHTML=`<div class="card"><div class="empty">${e(aa.error.message)}</div></div>`;return;}
  const tm={},pm={},sm={};(tt.data||[]).forEach(x=>(tm[x.assignment_id]??=[]).push(x));(pp.data||[]).forEach(x=>(pm[x.assignment_id]??=[]).push(x));(ss.data||[]).forEach(x=>sm[x.assignment_id]=x);
  const rm={},em={};(restaurants||[]).forEach(x=>rm[x.id]=x);(employees||[]).forEach(x=>em[x.id]=x);
  const rows=(aa.data||[]).map(a=>{const ts=tm[a.id]||[],ps=pm[a.id]||[],last=ts[0];return {a,r:rm[a.restaurant_id]?.name||'Unknown restaurant',u:em[a.employee_id]?.full_name||'Employee',d:a.work_date||'',m:mins(ts.reduce((n,x)=>n+dur(x.clock_in,x.clock_out),0)),ci:last?.clock_in,co:last?.clock_out,p:ps.length,b:ps.some(x=>x.photo_type==='before'),af:ps.some(x=>x.photo_type==='after'),sig:!!sm[a.id],done:a.status==='completed'};});
  const opts=(xs,p)=>`<option value="">${p}</option>`+xs.map(x=>`<option value="${e(x)}">${e(x)}</option>`).join('');
  const rid='histRestaurant',uid='histEmployee',did='histDate',sid='histStatus';
  $('content').innerHTML=`<div class="hero"><div class="eyebrow">MANAGEMENT</div><h1>Work History</h1><p>Review service records by restaurant, employee, and date.</p></div><div class="card"><div class="sectionhead"><div><div class="eyebrow">REPORTS</div><h3>Job Records</h3></div><div class="tiny" id="historyCount"></div></div><div class="field"><label>Restaurant<select id="${rid}">${opts([...new Set(rows.map(x=>x.r))].sort(),'All restaurants')}</select></label></div><div class="field"><label>Employee<select id="${uid}">${opts([...new Set(rows.map(x=>x.u))].sort(),'All employees')}</select></label></div><div class="field"><label>Service date<input id="${did}" type="date"></label></div><div class="field"><label>Status<select id="${sid}"><option value="">All statuses</option><option value="completed">Completed</option><option value="progress">In progress</option></select></label></div></div><div id="historyResults"></div>`;
  const draw=()=>{const rf=$(rid).value,uf=$(uid).value,df=$(did).value,sf=$(sid).value;const f=rows.filter(x=>(!rf||x.r===rf)&&(!uf||x.u===uf)&&(!df||x.d===df)&&(!sf||(sf==='completed'?x.done:!x.done)));$('historyCount').textContent=`${f.length} job${f.length===1?'':'s'} • ${f.reduce((n,x)=>n+x.p,0)} photo${f.reduce((n,x)=>n+x.p,0)===1?'':'s'}`;$('historyResults').innerHTML=f.map(x=>`<div class="card" style="margin-top:10px"><div class="sectionhead"><div><div class="eyebrow">${e(x.r)}</div><h3 style="margin:3px 0">${e(x.u)}</h3><div class="rowmeta">${e(date(x.d))}</div></div><span class="badge ${x.done?'':'off'}">${x.done?'COMPLETED':'IN PROGRESS'}</span></div><div class="stats" style="margin-top:10px;grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><div class="statlabel">TIME</div><div class="statvalue">${e(x.m)}</div></div><div class="stat"><div class="statlabel">PHOTOS</div><div class="statvalue">${x.p}</div></div></div><div class="rowmeta" style="margin-top:10px">Clock in ${e(time(x.ci))} • Clock out ${e(time(x.co))}</div><div class="rowmeta" style="margin-top:5px">Before ${x.b?'✓':'—'} • After ${x.af?'✓':'—'} • Signature ${x.sig?'✓':'—'}</div></div>`).join('')||'<div class="card"><div class="empty">No work records match these filters.</div></div>';};
  [rid,uid,did,sid].forEach(id=>$(id).addEventListener('change',draw));draw();
 };
})();
</script>

<script id="v95-announcements-js">
(function(){
  async function loadAnnouncements(){
    if(typeof supabase==='undefined') return [];
    const {data,error}=await supabase.from('announcements')
      .select('*')
      .eq('active',true)
      .order('created_at',{ascending:false});
    if(error) return [];
    return data||[];
  }

  function announcementAudienceVisible(a){
    const role=(typeof profile!=='undefined'&&profile?.role)||'employee';
    if(a.audience==='everyone') return true;
    if(a.audience==='managers') return role==='manager'||role==='owner';
    if(a.audience==='employees') return role==='employee';
    return true;
  }

  window.renderAnnouncements=async function(){
    const items=(await loadAnnouncements()).filter(announcementAudienceVisible);
    const unread=items.length;
    const rows=items.length ? items.map(a=>`
      <div class="announcement-item">
        <div class="announcement-title">${typeof esc==='function'?esc(a.title||'Announcement'):a.title||'Announcement'}</div>
        <div class="announcement-meta">${a.priority==='urgent'?'URGENT • ':a.priority==='important'?'IMPORTANT • ':''}${new Date(a.created_at).toLocaleDateString()}</div>
        <div class="announcement-body">${typeof esc==='function'?esc(a.body||''):a.body||''}</div>
      </div>`).join('') : `<div class="muted">No announcements yet.</div>`;

    return `<section class="card announcement-card">
      <div class="section-head">
        <div><div class="eyebrow">UPDATES</div><h3>Announcements ${unread?`<span class="announcement-badge">${unread}</span>`:''}</h3></div>
      </div>
      ${rows}
    </section>`;
  };

  window.ownerAnnouncements=async function(){
    const role=(typeof profile!=='undefined'&&profile?.role)||'';
    if(role!=='owner') return toast('Owner access only');

    const items=await loadAnnouncements();
    const rows=items.map(a=>`
      <div class="announcement-item">
        <div class="announcement-title">${esc(a.title||'Announcement')}</div>
        <div class="announcement-meta">${String(a.priority||'normal').toUpperCase()} • ${a.audience||'everyone'} • ${new Date(a.created_at).toLocaleDateString()}</div>
        <div class="announcement-body">${esc(a.body||'')}</div>
      </div>`).join('');

    openModal('Announcements',`
      <div class="announcement-form">
        <input id="annTitle" placeholder="Title">
        <textarea id="annBody" placeholder="Write your announcement..."></textarea>
        <select id="annAudience">
          <option value="everyone">Everyone</option>
          <option value="employees">Employees</option>
          <option value="managers">Managers</option>
        </select>
        <select id="annPriority">
          <option value="normal">Normal</option>
          <option value="important">Important</option>
          <option value="urgent">Urgent</option>
        </select>
        <button class="btn gold" id="publishAnnouncement">Publish Announcement</button>
      </div>
      <div style="margin-top:18px">${rows||'<div class="muted">No announcements yet.</div>'}</div>`);

    $('publishAnnouncement').onclick=async()=>{
      const title=$('annTitle').value.trim(),body=$('annBody').value.trim();
      if(!title||!body)return toast('Title and message are required');
      const {error}=await supabase.from('announcements').insert({
        title,body,
        audience:$('annAudience').value,
        priority:$('annPriority').value,
        active:true,
        created_by:profile.id
      });
      if(error)return toast(error.message);
      toast('Announcement published');
      closeModal();
      if(typeof render==='function') await render();
    };
  };
})();
</script>

const annSupabase=createAnnouncementsClient(
  'https://uwfoqbyejrfrgiwftvli.supabase.co',
  'sb_publishable_fKXaIcoTfnQ8joXp3VM_YA_1u82btt1'
);
const ann$=id=>document.getElementById(id);
const annEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

async function annProfile(){
  const {data:{user}}=await annSupabase.auth.getUser();
  if(!user)return null;
  const {data}=await annSupabase.from('profiles').select('id,full_name,role,active').eq('id',user.id).maybeSingle();
  return data||null;
}

async function getAnnouncements(){
  const p=await annProfile();
  if(!p||p.active===false)return {profile:p,items:[]};
  const {data,error}=await annSupabase.from('announcements')
    .select('id,title,body,audience,priority,created_at,created_by')
    .eq('active',true)
    .order('created_at',{ascending:false});
  if(error){
    console.error('Announcements:',error);
    return {profile:p,items:[],error};
  }
  const items=(data||[]).filter(a=>{
    if(a.audience==='everyone')return true;
    if(a.audience==='employees')return p.role==='employee';
    if(a.audience==='managers')return p.role==='manager'||p.role==='owner';
    return true;
  });
  return {profile:p,items};
}

async function showAnnouncements(){
  const {profile,items,error}=await getAnnouncements();
  if(!profile)return;
  const rows=items.length?items.map(a=>`
    <div class="announcement-item">
      <div class="announcement-title">${annEsc(a.title)}</div>
      <div class="announcement-meta">${String(a.priority||'normal').toUpperCase()} • ${new Date(a.created_at).toLocaleDateString()}</div>
      <div class="announcement-body">${annEsc(a.body)}</div>
      ${profile.role==='owner'?`<div style="margin-top:10px"><button class="btn secondary ann-delete" data-id="${a.id}" type="button" style="min-height:40px">Delete</button></div>`:''}
    </div>`).join(''):`<div class="muted">No announcements yet.</div>`;

  let ownerForm='';
  if(profile.role==='owner'){
    ownerForm=`
      <div class="announcement-compose">
        <input id="annTitle96" placeholder="Announcement title">
        <textarea id="annBody96" placeholder="Write your announcement..."></textarea>
        <select id="annAudience96">
          <option value="everyone">Everyone</option>
          <option value="employees">Employees</option>
          <option value="managers">Managers</option>
        </select>
        <select id="annPriority96">
          <option value="normal">Normal</option>
          <option value="important">Important</option>
          <option value="urgent">Urgent</option>
        </select>
        <button class="btn gold" id="publishAnnouncement96" type="button">Publish Announcement</button>
      </div>`;
  }

  const modal=document.getElementById('modal');
  const title=document.getElementById('modalTitle');
  const body=document.getElementById('modalBody');
  if(modal&&title&&body){
    title.textContent='ANNOUNCEMENTS';
    body.innerHTML=ownerForm+`<div class="announcement-list" style="margin-top:14px">${rows}</div>`;
    modal.classList.add('open');
  }

  document.querySelectorAll('.ann-delete').forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.dataset.id;
      if(!id || profile.role!=='owner') return;
      if(!confirm('Delete this announcement? This cannot be undone.')) return;
      btn.disabled=true;
      const {error}=await annSupabase.from('announcements').delete().eq('id',id);
      if(error){btn.disabled=false; alert(error.message); return;}
      if(typeof window.toast==='function') window.toast('Announcement deleted');
      await showAnnouncements();
      await updateAnnouncementBadge();
      if(typeof window.renderHome==='function') await window.renderHome();
    };
  });

  const publish=document.getElementById('publishAnnouncement96');
  if(publish){
    publish.onclick=async()=>{
      const t=document.getElementById('annTitle96').value.trim();
      const b=document.getElementById('annBody96').value.trim();
      if(!t||!b){alert('Please enter a title and message.');return;}
      const {error}=await annSupabase.from('announcements').insert({
        title:t,body:b,
        audience:document.getElementById('annAudience96').value,
        priority:document.getElementById('annPriority96').value,
        active:true,created_by:profile.id
      });
      if(error){alert(error.message);return;}
      if(typeof closeModal==='function')closeModal();else modal.classList.remove('open');
      await updateAnnouncementBadge();
    };
  }
}

async function updateAnnouncementBadge(){
  const {items}=await getAnnouncements();
  const badge=document.getElementById('announcementMenuBadge');
  if(badge){
    badge.textContent=String(items.length);
    badge.style.display=items.length?'inline-flex':'none';
  }
}

function installAnnouncementUI(){
  const btn=document.getElementById('announcementsBtn');
  if(btn)btn.onclick=showAnnouncements;
  updateAnnouncementBadge();
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',installAnnouncementUI);
}else{
  installAnnouncementUI();
}
</script>


<script id="v98-daily-job-js">
(function(){
  async function getCurrentProfile98(){
    if(typeof supabase==='undefined') return null;
    const {data:{user}}=await supabase.auth.getUser();
    if(!user)return null;
    const {data}=await supabase.from('profiles')
      .select('id,full_name,role,active')
      .eq('id',user.id).maybeSingle();
    return data||null;
  }

  function todayLocal98(){
    const d=new Date();
    return d.toISOString().slice(0,10);
  }

  async function ensureTodayJob98(profile){
    const today=todayLocal98();
    const dow=new Date(today+'T12:00:00').getDay();

    // Employee has access to all active restaurants. The schedule selects
    // today's restaurant; no recurring employee-to-restaurant assignment is required.
    const {data:restaurant,error:re}=await supabase.from('restaurants')
      .select('*').eq('active',true).eq('weekday',dow)
      .order('name').limit(1).maybeSingle();

    if(re||!restaurant)return {restaurant:null,assignment:null};

    let {data:assignment,error:ae}=await supabase.from('employee_assignments')
      .select('*')
      .eq('employee_id',profile.id)
      .eq('restaurant_id',restaurant.id)
      .eq('work_date',today)
      .limit(1).maybeSingle();

    if(ae)return {restaurant,assignment:null,error:ae};

    if(!assignment){
      const ins=await supabase.from('employee_assignments').insert({
        employee_id:profile.id,
        restaurant_id:restaurant.id,
        work_date:today,
        status:'assigned'
      }).select('*').single();
      if(!ins.error)assignment=ins.data;
      else return {restaurant,assignment:null,error:ins.error};
    }
    return {restaurant,assignment};
  }

  async function renderDailyJob98(){
    const profile=await getCurrentProfile98();
    if(!profile || profile.role!=='employee' || profile.active===false)return;

    const content=document.getElementById('content');
    if(!content)return;

    const result=await ensureTodayJob98(profile);
    const old=document.getElementById('dailyJob98');
    if(old)old.remove();

    const wrap=document.createElement('section');
    wrap.id='dailyJob98';
    wrap.className='card daily-job';

    if(!result.restaurant){
      wrap.innerHTML=`
        <div class="eyebrow">TODAY'S SERVICE</div>
        <h3>No service scheduled today</h3>
        <div class="muted">There is no active restaurant scheduled for today.</div>`;
      content.prepend(wrap);
      return;
    }

    const r=result.restaurant, a=result.assignment;
    const dayNames98=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const timeLabel=(typeof fmtTime==='function')?fmtTime(r.start_time):(r.start_time||'');
    const status=a?.status||'assigned';

    // Pull today's time entry for this employee/job.
    const {data:entry}=await supabase.from('time_entries')
      .select('*')
      .eq('employee_id',profile.id)
      .eq('restaurant_id',r.id)
      .eq('work_date',todayLocal98())
      .order('clock_in',{ascending:false})
      .limit(1).maybeSingle();

    const clocked=!!entry?.clock_in && !entry?.clock_out;

    wrap.innerHTML=`
      <div class="eyebrow">TODAY'S SERVICE</div>
      <h3>${typeof esc==='function'?esc(r.name):r.name}</h3>
      <div class="daily-job-grid">
        <div class="daily-job-meta">
          <div><div class="daily-job-label">Schedule</div><div class="daily-job-value">${dayNames98[r.weekday]||''} • ${timeLabel}</div></div>
          <div><div class="daily-job-label">Status</div><div class="daily-status"><span class="daily-dot ${clocked?'on':''}"></span>${clocked?'Clocked in':'Ready to clock in'}</div></div>
        </div>
        ${clocked?`<div class="daily-job-label">Clocked in at <span class="daily-job-value daily-time">${new Date(entry.clock_in).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div>`:''}
        <div class="daily-job-actions">
          <button class="btn gold" id="dailyClock98" type="button">${clocked?'Clock Out':'Clock In'}</button>
          <button class="btn secondary" id="dailyChecklist98" type="button">Open Checklist</button>
        </div>
      </div>`;

    const clock=document.getElementById('dailyClock98');
    const checklist=document.getElementById('dailyChecklist98');

    if(clock){
      clock.onclick=async()=>{
        clock.disabled=true;
        if(!clocked){
          const {error}=await supabase.from('time_entries').insert({
            employee_id:profile.id,
            restaurant_id:r.id,
            work_date:todayLocal98(),
            clock_in:new Date().toISOString()
          });
          if(error)alert(error.message);
          else if(typeof render==='function')await render();
        }else{
          const {error}=await supabase.from('time_entries').update({
            clock_out:new Date().toISOString()
          }).eq('id',entry.id);
          if(error)alert(error.message);
          else if(typeof render==='function')await render();
        }
        clock.disabled=false;
      };
    }

    if(checklist){
      checklist.onclick=()=>{
        const target=document.querySelector('[data-screen="home-checklist"],#checklistBtn,#startChecklistBtn');
        if(target)target.click();
        else if(typeof toast==='function')toast('Checklist is ready for today.');
      };
    }

    content.prepend(wrap);
  }

  // Run after the app has rendered its normal Home screen. A MutationObserver
  // catches navigation/rerenders without replacing existing app functions.
  function install98(){
    const content=document.getElementById('content');
    if(!content)return;
    let queued=false;
    const schedule=()=>{
      if(queued)return;
      queued=true;
      setTimeout(()=>{queued=false;renderDailyJob98()},120);
    };
    new MutationObserver(schedule).observe(content,{childList:true,subtree:false});
    setTimeout(renderDailyJob98,250);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install98);
  else install98();
})();
</script>

<script type="module" id="v912-checklist-module">
import { createClient as createChecklistClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cs=createChecklistClient('https://uwfoqbyejrfrgiwftvli.supabase.co','sb_publishable_fKXaIcoTfnQ8joXp3VM_YA_1u82btt1');
const ce=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function cp(){const {data:{user}}=await cs.auth.getUser();if(!user)return null;const {data}=await cs.from('profiles').select('id,role,active').eq('id',user.id).maybeSingle();return data||null}
async function openChecklistSetup(){
 const p=await cp();if(!p||!['owner','manager'].includes(p.role))return;
 const [r,c,i,b]=await Promise.all([
  cs.from('restaurants').select('id,name,weekday,start_time,active').eq('active',true).order('weekday'),
  cs.from('checklist_categories').select('id,name,sort_order').eq('active',true).order('sort_order'),
  cs.from('checklist_items').select('id,category_id,name,description,sort_order').eq('active',true).order('sort_order'),

 ]);
 if(r.error||c.error||i.error||b.error)return alert((r.error||c.error||i.error||b.error).message);
 const restaurants=r.data||[], cats=c.data||[], items=i.data||[], baths=b.data||[];
 const configs=await Promise.all(restaurants.map(async x=>{const q=await cs.from('restaurant_checklist_config').select('checklist_item_id,sort_order').eq('restaurant_id',x.id).eq('active',true).order('sort_order');return [x.id,q.data||[]]}));
 const map=Object.fromEntries(configs);
 const body=`<p class="muted">Choose exactly which cleaning tasks apply to each restaurant. Bathrooms are always mandatory.</p><div class="check-setup-grid">${restaurants.map(rest=>{
  const chosen=new Set((map[rest.id]||[]).map(x=>x.checklist_item_id));
  const rb=baths.filter(x=>x.restaurant_id===rest.id);
  return `<div class="check-restaurant"><div class="check-restaurant-head"><div><b>${ce(rest.name)}</b><div class="muted">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][rest.weekday]||''} • ${ce(rest.start_time||'')}</div></div><span class="badge">${chosen.size} tasks</span></div><div class="check-restaurant-body">${cats.map(cat=>{const its=items.filter(x=>x.category_id===cat.id);if(!its.length)return '';return `<div class="tiny" style="margin-top:3px">${ce(cat.name)}</div>${its.map(it=>`<label class="check-choice"><input type="checkbox" class="rc-item" data-rid="${rest.id}" data-iid="${it.id}" ${chosen.has(it.id)?'checked':''}><span><b>${ce(it.name)}</b>${it.description?`<small>${ce(it.description)}</small>`:''}</span></label>`).join('')}`}).join('')}<div class="check-choice"><span>🚻</span><span><b>Bathrooms — Mandatory</b><small>${rb.length?rb.map(x=>ce(x.name||'Bathroom')).join(' • '):'No bathroom configured yet'}</small></span></div></div></div>`;
 }).join('')}</div><div class="check-savebar"><button class="btn gold" id="saveChecklistConfig">Save Restaurant Checklists</button></div>`;
 const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),mb=document.getElementById('modalBody');title.textContent='CHECKLIST SETUP';mb.innerHTML=body;modal.classList.add('open');
 document.getElementById('saveChecklistConfig').onclick=async()=>{
  const btn=document.getElementById('saveChecklistConfig');btn.disabled=true;
  for(const rest of restaurants){
   const checked=[...document.querySelectorAll(`.rc-item[data-rid="${rest.id}"]:checked`)].map((x,n)=>({restaurant_id:rest.id,checklist_item_id:x.dataset.iid,active:true,sort_order:n}));
   const del=await cs.from('restaurant_checklist_config').delete().eq('restaurant_id',rest.id);if(del.error){btn.disabled=false;return alert(del.error.message)}
   if(checked.length){const ins=await cs.from('restaurant_checklist_config').insert(checked);if(ins.error){btn.disabled=false;return alert(ins.error.message)}}

 };
}
window.openChecklistSetup=openChecklistSetup;
function addButton(){const drawer=document.getElementById('drawer');if(!drawer||document.getElementById('checklistSetupBtn'))return;const cards=drawer.querySelectorAll('.card');const c=cards[2];if(!c)return;const b=document.createElement('button');b.id='checklistSetupBtn';b.className='btn secondary';b.type='button';b.textContent='Checklist Setup';b.style.marginTop='8px';b.onclick=()=>{drawer.classList.remove('open');openChecklistSetup()};c.appendChild(b)}
addButton();setTimeout(addButton,500);setInterval(addButton,1500);
