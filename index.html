<style>

  --bg:#0a0c11;--panel:#11151d;--panel2:#171c25;--panel3:#1d232d;

html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:3000;background:var(--gold);color:#0b0d12;padding:9px 13px;border-radius:99px;font-size:10px;font-weight:900;box-shadow:0 10px 30px #0008}

<script id="v92-menu-fix">
(function(){
  function installMenuFix(){
    const btn=document.getElementById('menuBtn');
    const drawer=document.getElementById('drawer');
    if(!btn || !drawer) return;

    // Remove the original inline handler so the repaired handler is authoritative.
    btn.onclick=null;

    const openMenu=function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      drawer.classList.add('open');
      drawer.style.display='';
      drawer.removeAttribute('aria-hidden');
    };

    btn.addEventListener('pointerup',openMenu,{passive:false});
    btn.addEventListener('touchend',openMenu,{passive:false});
    btn.addEventListener('click',openMenu);

    // Make the icon itself non-blocking and ensure the button is above the header.
    btn.style.pointerEvents='auto';
    btn.style.position='relative';
    btn.style.zIndex='10001';
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',installMenuFix);
  }else{
    installMenuFix();
  }
})();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://uwfoqbyejrfrgiwftvli.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_fKXaIcoTfnQ8joXp3VM_YA_1u82btt1';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const localDate=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
const fmtTime=t=>{if(!t)return '';const [h,m]=String(t).slice(0,5).split(':').map(Number);const d=new Date();d.setHours(h,m);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const toast=m=>{const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)};
const initials=n=>String(n||'Employee').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();

let session=null, profile=null, restaurants=[], employees=[], tab='home';
let assignment=null, tasks=[], timeEntry=null, photos=[];
let lang=localStorage.getItem('cleaning_ops_lang')||'en';

const tr={
 en:{home:'Overview',schedule:'Schedule',team:'Team',work:'Work',employee:'Employee',manager:'Manager',owner:'Owner',
 signIn:'Sign In',signup:'Employee Sign Up',forgot:'Forgot Password',create:'Create Employee Account',
 name:'Full Name',email:'Email',password:'Password',confirm:'Confirm Password',menu:'MENU',language:'LANGUAGE',
 account:'ACCOUNT',signOut:'Sign Out',today:'Today',assignment:'Assignment',notAssigned:'Waiting for assignment',

 employees:'Employees',restaurants:'Restaurants',assign:'Assign',manage:'Manage',active:'Active',inactive:'Inactive',
 addRestaurant:'Add Restaurant',editRestaurant:'Edit Restaurant',save:'Save Changes',workDate:'Work date',
 before:'Before Cleaning',after:'After Cleaning',upload:'Upload Photos',complete:'Complete Job',
 noRestaurant:'NO RESTAURANT SCHEDULED',noEmployees:'No employees yet.',noAssignments:'No assignments.',
 ownerControl:'Owner Control',managerControl:'Manager Control',promote:'Make Manager',demote:'Remove Manager',
 activate:'Activate',deactivate:'Deactivate',view:'View',remove:'Remove',search:'Search employees…',
 schedule:'Weekly Schedule',connected:'Cloud Connected',checkSetup:'Checklist Setup',bathrooms:'Bathrooms',
 hours:'Hours',jobPhotos:'Job Photos',signatures:'Signatures',details:'Details',back:'Back'
 },
 es:{home:'Inicio',schedule:'Horario',team:'Equipo',work:'Trabajo',employee:'Empleado',manager:'Gerente',owner:'Propietario',
 signIn:'Iniciar sesión',signup:'Registro de empleado',forgot:'Olvidé mi contraseña',create:'Crear cuenta de empleado',
 name:'Nombre completo',email:'Correo electrónico',password:'Contraseña',confirm:'Confirmar contraseña',menu:'MENÚ',language:'IDIOMA',
 account:'CUENTA',signOut:'Cerrar sesión',today:'Hoy',assignment:'Asignación',notAssigned:'Esperando asignación',
 clockIn:'Marcar entrada',clockOut:'Marcar salida',checklist:'Lista de limpieza',photos:'Fotos',history:'Historial',
 employees:'Empleados',restaurants:'Restaurantes',assign:'Asignar',manage:'Administrar',active:'Activo',inactive:'Inactivo',
 addRestaurant:'Agregar restaurante',editRestaurant:'Editar restaurante',save:'Guardar cambios',workDate:'Fecha de trabajo',
 before:'Antes de limpiar',after:'Después de limpiar',upload:'Subir fotos',complete:'Completar trabajo',
 noRestaurant:'NO HAY RESTAURANTE PROGRAMADO',noEmployees:'No hay empleados todavía.',noAssignments:'No hay asignaciones.',
 ownerControl:'Control del propietario',managerControl:'Control del gerente',promote:'Hacer gerente',demote:'Quitar gerente',
 activate:'Activar',deactivate:'Desactivar',view:'Ver',remove:'Eliminar',search:'Buscar empleados…',
 schedule:'Horario semanal',connected:'Conectado a la nube',checkSetup:'Configuración de lista',bathrooms:'Baños',
 hours:'Horas',jobPhotos:'Fotos del trabajo',signatures:'Firmas',details:'Detalles',back:'Atrás'}
};
const T=k=>(tr[lang]&&tr[lang][k])||tr.en[k]||k;

const isManagement=()=>profile?.role==='owner'||profile?.role==='manager';
const isOwner=()=>profile?.role==='owner';

function roleLabel(){return profile?.role==='owner'?T('owner'):profile?.role==='manager'?T('manager'):T('employee')}

function loginScreen(msg=''){
 $('loginView').innerHTML=`
 <div class="brand">CLEANING OPS</div>
 <p>Restaurant Cleaning Management</p>
 <div class="card loginbox">
   ${msg?`<div class="notice" style="margin-bottom:10px">${esc(msg)}</div>`:''}
   <div class="field"><label>${T('email')}<input id="email" type="email" autocomplete="username"></label></div>
   <div class="field"><label>${T('password')}<input id="password" type="password" autocomplete="current-password"></label></div>
   <button class="btn gold" id="loginBtn">${T('signIn')}</button>
   <button class="btn secondary" id="signupBtn" style="margin-top:7px">${T('signup')}</button>
   <button class="btn secondary" id="resetBtn" style="margin-top:7px">${T('forgot')}</button>
 </div>`;
 $('loginBtn').onclick=signIn;$('signupBtn').onclick=signupScreen;$('resetBtn').onclick=resetPassword;
}
function signupScreen(msg=''){
 $('loginView').innerHTML=`
 <div class="brand">CLEANING OPS</div>
 <p>${T('signup')}</p>
 <div class="card loginbox">
  ${msg?`<div class="notice" style="margin-bottom:10px">${esc(msg)}</div>`:''}
  <div class="field"><label>${T('name')}<input id="suName" autocomplete="name"></label></div>
  <div class="field"><label>${T('email')}<input id="suEmail" type="email" autocomplete="email"></label></div>
  <div class="field"><label>${T('password')}<input id="suPass" type="password" autocomplete="new-password"></label></div>
  <div class="field"><label>${T('confirm')}<input id="suConfirm" type="password" autocomplete="new-password"></label></div>
  <button class="btn gold" id="createBtn">${T('create')}</button>
  <button class="btn secondary" id="backBtn" style="margin-top:7px">${T('back')}</button>
 </div>`;
 $('createBtn').onclick=signup;$('backBtn').onclick=()=>loginScreen();
}
async function signup(){
 const name=$('suName')?.value.trim(),email=$('suEmail')?.value.trim(),pass=$('suPass')?.value,confirm=$('suConfirm')?.value;
 if(!name||!email||!pass)return signupScreen('Please complete every field.');
 if(pass.length<6)return signupScreen('Password must be at least 6 characters.');
 if(pass!==confirm)return signupScreen('Passwords do not match.');
 $('createBtn').disabled=true;
 const {data,error}=await supabase.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
 if(error){$('createBtn').disabled=false;return signupScreen(error.message)}
 if(data.session){session=data.session;await boot()}else loginScreen('Account created. Check your email to confirm, then sign in.');
}
async function signIn(){
 const email=$('email')?.value.trim(),password=$('password')?.value;
 if(!email||!password)return toast('Enter your email and password');
 $('loginBtn').disabled=true;
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error){$('loginBtn').disabled=false;return loginScreen(error.message)}
 session=data.session;await boot();
}
async function resetPassword(){
 const email=$('email')?.value.trim();if(!email)return toast('Enter your email first');
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 toast(error?error.message:'Password reset email sent');
}

async function boot(){
 const {data:{session:s}}=await supabase.auth.getSession();session=s;
 if(!session)return loginScreen();
 const {data:p,error}=await supabase.from('profiles').select('id,full_name,role,active,created_at').eq('id',session.user.id).single();
 if(error||!p)return loginScreen('Your account profile is not set up yet.');
 if(p.active===false){await supabase.auth.signOut();return loginScreen('This account is inactive.');}
 profile=p;
 await loadBase();
 renderShell();
 await showTab('home');
}

async function loadBase(){
 const r=await supabase.from('restaurants').select('id,name,weekday,start_time,active').order('weekday').order('name');
 if(!r.error)restaurants=r.data||[];
 if(isManagement()){
  const e=await supabase.from('profiles').select('id,full_name,role,active,created_at').in('role',['employee','manager']).order('full_name');
  if(!e.error)employees=e.data||[];
 }
}

function renderShell(){
 $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('bottomNav').classList.remove('hidden');
 $('topMeta').textContent=`${roleLabel()} • ${profile.full_name||session.user.email}`;
 $('drawerName').textContent=profile.full_name||'—';$('drawerEmail').textContent=session.user.email||'';
 $('drawerRole').innerHTML=`<span class="badge ${profile.active===false?'off':''}">${esc(roleLabel())}</span>`;
 $('bottomNav').innerHTML=`
 <button data-tab="home"><span class="navline"></span>${T('home')}</button>
 <button data-tab="schedule"><span class="navline"></span>${T('schedule')}</button>
 ${isManagement()?`<button data-tab="team"><span class="navline"></span>${T('team')}</button>`:''}
 <button data-tab="work"><span class="navline"></span>${T('work')}</button>`;
 $('bottomNav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
}
async function showTab(t){tab=t;$('bottomNav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));await render();}
async function render(){
 if(tab==='home')await renderHome();
 if(tab==='schedule')await renderSchedule();
 if(tab==='team')await renderTeam();
 if(tab==='work')await renderWork();
}

function todayRestaurant(){return restaurants.find(r=>r.weekday===new Date().getDay()&&r.active!==false)||null}

async function loadToday(){
 assignment=null;tasks=[];timeEntry=null;photos=[];
 const r=todayRestaurant();if(!r)return;
 let q=supabase.from('employee_assignments').select('*').eq('restaurant_id',r.id).eq('work_date',localDate());
 if(!isManagement())q=q.eq('employee_id',session.user.id);
 const {data:a,error}=await q.order('created_at',{ascending:true});
 if(error)return;
 assignment=isManagement()?(a||[])[0]:(a||[])[0];
 if(!assignment)return;
 const t=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
 tasks=t.data||[];
 if(!tasks.length){
   const temp=await supabase.from('task_templates').select('name').eq('active',true).order('sort_order');
   if(temp.data?.length){
     await supabase.from('checklist_tasks').insert(temp.data.map(x=>({assignment_id:assignment.id,task_name:x.name,completed:false})));
     const tt=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
     tasks=tt.data||[];
   }
 }
 if(!isManagement()){
   const te=await supabase.from('time_entries').select('id,clock_in,clock_out').eq('assignment_id',assignment.id).eq('employee_id',session.user.id).order('clock_in',{ascending:false}).limit(1);
   timeEntry=te.data?.[0]||null;
   const ph=await supabase.from('job_photos').select('id,photo_type,storage_path,created_at').eq('assignment_id',assignment.id).eq('employee_id',session.user.id).order('created_at',{ascending:false});
   photos=ph.data||[];
 }
}

async function renderHome(){
 await loadToday();
 const r=todayRestaurant();
 if(!r){
  $('content').innerHTML=`<div class="hero"><div class="eyebrow">${T('today')}</div><h1>${T('noRestaurant')}</h1></div>
  <div class="card"><p>There is no active restaurant scheduled for today.</p></div>`;
  return;
 }
 const done=tasks.filter(x=>x.completed).length,total=tasks.length,pct=total?Math.round(done/total*100):0;
 const clocked=!!timeEntry&&!timeEntry.clock_out;
 $('content').innerHTML=`
 <div class="hero"><div class="eyebrow">${T('today')}</div><h1>${esc(r.name)}</h1><p>${dayNames[new Date().getDay()]} • ${fmtTime(r.start_time)}</p></div>
 <div class="grid3">
  <div class="statcard"><div class="statlabel">${T('checklist')}</div><div class="statvalue">${done}/${total}</div></div>
  <div class="statcard"><div class="statlabel">${T('assignment')}</div><div class="statvalue">${assignment?'1':'0'}</div></div>
  <div class="statcard"><div class="statlabel">${isManagement()?T('employees'):T('hours')}</div><div class="statvalue">${isManagement()?employees.length:(clocked?'ON':'—')}</div></div>
 </div>
 <div class="card ${assignment?'gold':''}" style="margin-top:9px">
   <div class="row"><div><div class="tiny">${T('assignment')}</div><div style="font-size:15px;font-weight:750;margin-top:4px">${assignment?esc(isManagement()?(employees.find(e=>e.id===assignment.employee_id)?.full_name||'Employee'):(r.name)):T('notAssigned')}</div></div>
   ${assignment?`<span class="badge">${esc(assignment.status||'assigned')}</span>`:''}</div>
   ${!isManagement()&&assignment?`<button class="btn ${clocked?'secondary':'gold'}" id="clockBtn" style="margin-top:11px">${clocked?T('clockOut'):T('clockIn')}</button>`:''}
   ${isManagement()?`<button class="btn secondary" id="openTeam" style="margin-top:11px">${T('manage')}</button>`:''}
 </div>
 ${assignment?`<div class="card">
  <div class="row"><h2>${T('checklist')}</h2><span class="badge">${pct}%</span></div>
  <div class="progress"><div style="width:${pct}%"></div></div>
  ${tasks.map(x=>`<label class="task ${x.completed?'done':''}"><input type="checkbox" data-task="${x.id}" ${x.completed?'checked':''} ${isManagement()?'disabled':''}><span>${esc(x.task_name)}</span></label>`).join('')}
  ${!isManagement()?`<button class="btn ${pct===100?'gold':''}" id="completeBtn" style="margin-top:10px" ${pct<100?'disabled':''}>${T('complete')}</button>`:''}
 </div>`:`<div class="card"><div class="tiny">${T('assignment')}</div><h2>${T('notAssigned')}</h2><p>${isManagement()?'Assign an employee from Team.':'Your manager has not assigned you to today’s restaurant yet.'}</p></div>`}`;
 if($('clockBtn'))$('clockBtn').onclick=clockToggle;
 if($('completeBtn'))$('completeBtn').onclick=completeJob;
 if($('openTeam'))$('openTeam').onclick=()=>showTab('team');
 document.querySelectorAll('[data-task]').forEach(c=>c.onchange=async e=>{
   const {error}=await supabase.from('checklist_tasks').update({completed:e.target.checked,completed_at:e.target.checked?new Date().toISOString():null}).eq('id',e.target.dataset.task);
   if(error)return toast(error.message);await renderHome();
 });
}

async function clockToggle(){
 if(!assignment)return;
 if(timeEntry&&!timeEntry.clock_out){
   const {error}=await supabase.from('time_entries').update({clock_out:new Date().toISOString()}).eq('id',timeEntry.id);
   if(error)return toast(error.message);toast('Clocked out');
 }else{
   const {error}=await supabase.from('time_entries').insert({assignment_id:assignment.id,employee_id:session.user.id,clock_in:new Date().toISOString()});
   if(error)return toast(error.message);toast('Clocked in');
 }
 await renderHome();
}
async function completeJob(){
 if(tasks.some(x=>!x.completed))return toast('Finish every task first');
 const {error}=await supabase.from('employee_assignments').update({status:'completed'}).eq('id',assignment.id);
 if(error)return toast(error.message);
 await supabase.from('notifications').insert({type:'job_completed',title:'Job completed',body:`${profile.full_name||'Employee'} completed ${todayRestaurant()?.name||'the restaurant'}.`,related_id:assignment.id});
 toast('Job completed');await renderHome();
}

async function renderSchedule(){
 const rows=restaurants.map(r=>`<div class="listrow"><div class="avatar">${String(r.name||'R').slice(0,2).toUpperCase()}</div><div class="rowmain"><div class="rowtitle">${esc(r.name)}</div><div class="rowmeta">${dayNames[r.weekday]||''} • ${fmtTime(r.start_time)}</div></div>${isManagement()?`<button class="btn small" data-edit-r="${r.id}">${T('manage')}</button>`:''}</div>`).join('');
 $('content').innerHTML=`
 <div class="hero"><div class="eyebrow">${T('schedule')}</div><h1>${T('schedule')}</h1></div>
 <div class="card">${isManagement()?`<button class="btn gold" id="addRestaurant">${T('addRestaurant')}</button>`:''}
 <div class="list" style="margin-top:9px">${rows||`<div class="empty">No restaurants found.</div>`}</div></div>`;
 if($('addRestaurant'))$('addRestaurant').onclick=()=>restaurantModal();
 document.querySelectorAll('[data-edit-r]').forEach(b=>b.onclick=()=>restaurantModal(b.dataset.editR));
}

async function restaurantModal(id=null){
 const r=id?restaurants.find(x=>x.id===id):null;
 openModal(id?T('editRestaurant'):T('addRestaurant'),`
 <div class="field"><label>Name<input id="rName" value="${esc(r?.name||'')}"></label></div>
 <div class="grid2">
  <div class="field"><label>Weekday<select id="rDay">${dayNames.map((d,i)=>`<option value="${i}" ${(r?.weekday??1)===i?'selected':''}>${d}</option>`).join('')}</select></label></div>
  <div class="field"><label>Start Time<input id="rTime" type="time" value="${esc((r?.start_time||'').slice(0,5))}"></label></div>
 </div>
 <button class="btn gold" id="saveRestaurant">${T('save')}</button>
 ${r?`<button class="btn danger" id="toggleRestaurant" style="margin-top:7px">${r.active===false?T('activate'):T('deactivate')}</button>`:''}
 `);
 $('saveRestaurant').onclick=async()=>{
  const name=$('rName').value.trim(),weekday=Number($('rDay').value),start_time=$('rTime').value;
  if(!name||!start_time)return toast('Name and time are required');
  const payload={name,weekday,start_time,active:true};
  const q=id?supabase.from('restaurants').update(payload).eq('id',id):supabase.from('restaurants').insert(payload);
  const {error}=await q;if(error)return toast(error.message);
  closeModal();await loadBase();await renderSchedule();toast('Saved');
 };
 if($('toggleRestaurant'))$('toggleRestaurant').onclick=async()=>{
  const {error}=await supabase.from('restaurants').update({active:r.active===false}).eq('id',id);
  if(error)return toast(error.message);closeModal();await loadBase();await renderSchedule();
 };
}

async function renderTeam(){
 if(!isManagement()){return showTab('home')}
 await loadBase();
 const as=await supabase.from('employee_assignments').select('id,employee_id,restaurant_id,work_date,status').order('work_date',{ascending:false});
 const assignments=as.data||[];
 $('content').innerHTML=`
 <div class="hero"><div class="eyebrow">${isOwner()?T('ownerControl'):T('managerControl')}</div><h1>${T('team')}</h1></div>
 <div class="grid3">
  <div class="statcard"><div class="statlabel">${T('employees')}</div><div class="statvalue">${employees.filter(e=>e.role==='employee').length}</div></div>
  <div class="statcard"><div class="statlabel">${T('restaurants')}</div><div class="statvalue">${restaurants.length}</div></div>
  <div class="statcard"><div class="statlabel">${T('assign')}</div><div class="statvalue">${assignments.length}</div></div>
 </div>
 <div class="card" style="margin-top:9px">
  <div class="field"><label>${T('search')}<input id="teamSearch" placeholder="${T('search')}"></label></div>
  <div class="list" id="teamList"></div>
 </div>
 <div class="sectionhead"><h2>${T('restaurants')}</h2><button class="link" id="teamRestaurants">Manage</button></div>
 <div class="card"><p>${T('connected')}</p><button class="btn secondary" id="checklistManage">${T('checkSetup')}</button></div>`;
 const renderList=()=>{
  const q=($('teamSearch')?.value||'').toLowerCase();
  const list=employees.filter(e=>(e.full_name||'').toLowerCase().includes(q));
  $('teamList').innerHTML=list.length?list.map(e=>{
   const ea=assignments.filter(a=>a.employee_id===e.id);
   const role=e.role;
   return `<div class="listrow">
    <div class="avatar">${initials(e.full_name)}</div><div class="rowmain">
     <div class="rowtitle">${esc(e.full_name||'Employee')}</div>
     <div class="rowmeta">${role==='manager'?T('manager'):T('employee')} • ${ea.length} assignment${ea.length===1?'':'s'}</div>
    </div>
    <span class="badge ${e.active===false?'off':'ok'}">${e.active===false?T('inactive'):T('active')}</span>
    <button class="btn small" data-manage-e="${e.id}">${T('manage')}</button>
   </div>`;
  }).join(''):`<div class="empty">${T('noEmployees')}</div>`;
  document.querySelectorAll('[data-manage-e]').forEach(b=>b.onclick=()=>employeeModal(b.dataset.manageE,assignments));
 };
 $('teamSearch').oninput=renderList;renderList();
 $('teamRestaurants').onclick=()=>showTab('schedule');
 $('checklistManage').onclick=()=>checklistManager();
}

async function employeeModal(id,allAssignments){
 const e=employees.find(x=>x.id===id);if(!e)return;
 const ea=allAssignments.filter(a=>a.employee_id===id);
 openModal(T('manage'),`
  <div class="row"><div><div style="font-size:15px;font-weight:750">${esc(e.full_name||'Employee')}</div><div class="rowmeta">${esc(e.role)}</div></div><span class="badge ${e.active===false?'off':'ok'}">${e.active===false?T('inactive'):T('active')}</span></div>
  <div class="sectionhead"><h2>${T('assignment')}</h2></div>
  <div class="list" id="empAssignments">${ea.length?ea.map(a=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(restaurants.find(r=>r.id===a.restaurant_id)?.name||'Restaurant')}</div><div class="rowmeta">${esc(a.work_date||'')}</div></div><button class="btn small danger" data-remove-a="${a.id}">${T('remove')}</button></div>`).join(''):`<div class="empty">${T('noAssignments')}</div>`}</div>
  <div class="grid2" style="margin-top:8px">
   <button class="btn gold" id="assignEmployee">${T('assign')}</button>
   <button class="btn secondary" id="historyEmployee">${T('history')}</button>
  </div>
  <button class="btn secondary" id="toggleEmployee" style="margin-top:7px">${e.active===false?T('activate'):T('deactivate')}</button>
  ${isOwner()&&e.role==='employee'?`<button class="btn secondary" id="promoteEmployee" style="margin-top:7px">${T('promote')}</button>`:''}
  ${isOwner()&&e.role==='manager'?`<button class="btn danger" id="demoteEmployee" style="margin-top:7px">${T('demote')}</button>`:''}
 `);
 document.querySelectorAll('[data-remove-a]').forEach(b=>b.onclick=async()=>{
  const {error}=await supabase.from('employee_assignments').delete().eq('id',b.dataset.removeA);
  if(error)return toast(error.message);closeModal();await renderTeam();
 });
 $('assignEmployee').onclick=()=>assignmentModal(e.id);
 $('historyEmployee').onclick=()=>employeeHistory(e.id);
 $('toggleEmployee').onclick=async()=>{
  const {error}=await supabase.from('profiles').update({active:e.active===false}).eq('id',e.id);
  if(error)return toast(error.message);closeModal();await loadBase();await renderTeam();
 };
 if($('promoteEmployee'))$('promoteEmployee').onclick=async()=>{
  const {error}=await supabase.from('profiles').update({role:'manager'}).eq('id',e.id);
  if(error)return toast(error.message);toast('Employee promoted to Manager');closeModal();await loadBase();await renderTeam();
 };
 if($('demoteEmployee'))$('demoteEmployee').onclick=async()=>{
  const {error}=await supabase.from('profiles').update({role:'employee'}).eq('id',e.id);
  if(error)return toast(error.message);toast('Manager changed to Employee');closeModal();await loadBase();await renderTeam();
 };
}

async function assignmentModal(empId){
 openModal(T('assign'),`
  <div class="field"><label>${T('restaurants')}<select id="aRestaurant">${restaurants.filter(r=>r.active!==false).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label></div>
  <div class="field"><label>${T('workDate')}<input id="aDate" type="date" value="${localDate()}"></label></div>
  <button class="btn gold" id="saveAssignment">${T('assign')}</button>`);
 $('saveAssignment').onclick=async()=>{
  const restaurant_id=$('aRestaurant').value,work_date=$('aDate').value;
  if(!restaurant_id||!work_date)return;
  const exists=await supabase.from('employee_assignments').select('id').eq('employee_id',empId).eq('restaurant_id',restaurant_id).eq('work_date',work_date).maybeSingle();
  if(exists.data)return toast('Already assigned');
  const {error}=await supabase.from('employee_assignments').insert({employee_id:empId,restaurant_id,work_date,status:'assigned'});
  if(error)return toast(error.message);toast('Assignment saved');closeModal();await renderTeam();
 };
}

async function employeeHistory(id){
 const [t,p,s]=await Promise.all([
  supabase.from('time_entries').select('*').eq('employee_id',id).order('clock_in',{ascending:false}).limit(30),
  supabase.from('job_photos').select('*').eq('employee_id',id).order('created_at',{ascending:false}).limit(30),
  supabase.from('completion_signatures').select('*').eq('employee_id',id).order('created_at',{ascending:false}).limit(30)
 ]);
 openModal(T('history'),`
 <div class="grid3">
  <div class="statcard"><div class="statlabel">${T('hours')}</div><div class="statvalue">${(t.data||[]).length}</div></div>
  <div class="statcard"><div class="statlabel">${T('jobPhotos')}</div><div class="statvalue">${(p.data||[]).length}</div></div>
  <div class="statcard"><div class="statlabel">${T('signatures')}</div><div class="statvalue">${(s.data||[]).length}</div></div>
 </div>
 <div class="sectionhead"><h2>${T('hours')}</h2></div>
 <div class="list">${(t.data||[]).slice(0,12).map(x=>`<div class="listrow"><div class="rowmain"><div class="rowtitle">${new Date(x.clock_in).toLocaleDateString()}</div><div class="rowmeta">${new Date(x.clock_in).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} → ${x.clock_out?new Date(x.clock_out).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'Open'}</div></div></div>`).join('')||`<div class="empty">No time entries.</div>`}</div>
 `);
}

async function renderWork(){
 if(!isManagement()){
  await loadToday();
  $('content').innerHTML=`
   <div class="hero"><div class="eyebrow">${T('work')}</div><h1>${T('photos')}</h1></div>
   <div class="card"><p>${assignment?'Upload the required before and after photos for today’s assignment.':'No job is assigned to you today.'}</p>
   ${assignment?`<div class="photoGrid">
    <div><div class="tiny">${T('before')}</div><input id="beforeFile" type="file" accept="image/*" capture="environment" style="margin-top:7px;width:100%"></div>
    <div><div class="tiny">${T('after')}</div><input id="afterFile" type="file" accept="image/*" capture="environment" style="margin-top:7px;width:100%"></div>
   </div><button class="btn gold" id="uploadBtn" style="margin-top:10px">${T('upload')}</button>`:''}</div>`;
  if($('uploadBtn'))$('uploadBtn').onclick=uploadPhotos;
  return;
 }
 const ph=await supabase.from('job_photos').select('id,employee_id,assignment_id,photo_type,storage_path,created_at').order('created_at',{ascending:false}).limit(40);
 const list=ph.data||[];
 const cards=await Promise.all(list.map(async p=>{
  const emp=employees.find(e=>e.id===p.employee_id)?.full_name||'Employee';
  const signed=await supabase.storage.from('job-photos').createSignedUrl(p.storage_path,3600);
  return `<div class="listrow"><div class="rowmain"><div class="rowtitle">${esc(emp)} • ${esc(p.photo_type)}</div><div class="rowmeta">${new Date(p.created_at).toLocaleString()}</div>${signed.data?.signedUrl?`<img class="photo" style="margin-top:7px" src="${esc(signed.data.signedUrl)}" alt="">`:''}</div></div>`;
 }));
 $('content').innerHTML=`<div class="hero"><div class="eyebrow">${T('work')}</div><h1>${T('jobPhotos')}</h1></div><div class="card"><div class="list">${cards.join('')||`<div class="empty">No job photos yet.</div>`}</div></div>`;
}

async function uploadPhotos(){
 if(!assignment)return toast('No assignment');
 const before=$('beforeFile')?.files?.[0],after=$('afterFile')?.files?.[0];
 if(!before&&!after)return toast('Choose a photo');
 for(const [type,file] of [['before',before],['after',after]]){
  if(!file)continue;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${session.user.id}/${assignment.id}/${type}-${Date.now()}.${ext}`;
  const up=await supabase.storage.from('job-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(up.error)return toast(up.error.message);
  const rec=await supabase.from('job_photos').insert({assignment_id:assignment.id,employee_id:session.user.id,photo_type:type,storage_path:path});
  if(rec.error)return toast(rec.error.message);
  await supabase.from('notifications').insert({type:'photo_uploaded',title:`${type} photo uploaded`,body:`${profile.full_name||'Employee'} uploaded a ${type} photo.`,related_id:assignment.id});
 }
 toast('Photos uploaded');await renderWork();
}

async function checklistManager(){
 const [c,i,s,b]=await Promise.all([
  supabase.from('checklist_categories').select('*').eq('active',true).order('sort_order'),
  supabase.from('checklist_items').select('*').eq('active',true).order('sort_order'),
  supabase.from('checklist_subtasks').select('*').eq('active',true).order('sort_order'),
  supabase.from('restaurant_bathrooms').select('*').eq('active',true)
 ]);
 const cats=c.data||[],items=i.data||[],subs=s.data||[],baths=b.data||[];
 openModal(T('checkSetup'),`
  <p>Detailed checklist catalog is connected. Bathrooms remain mandatory on every service day.</p>
  <div class="list">
   ${cats.map(cat=>`<div class="checkcat"><button class="checkcathead" type="button"><b>${esc(cat.name)}</b><span>⌄</span></button>
    <div class="checkcatbody">${items.filter(x=>x.category_id===cat.id).map(it=>`<div class="checkitem"><b>${esc(it.name)}</b>${it.description?`<small>${esc(it.description)}</small>`:''}${subs.filter(x=>x.item_id===it.id).map(st=>`<div class="subtask">${esc(st.name)}</div>`).join('')}</div>`).join('')||'<div class="subtask">No items configured.</div>'}</div>
   </div>`).join('')}
   <div class="checkcat open"><button class="checkcathead" type="button"><b>Bathrooms — Mandatory</b><span>⌄</span></button>
    <div class="checkcatbody">${baths.length?baths.map(b=>`<div class="checkitem"><b>${esc(b.name||'Bathroom')}</b><small>${Number(b.toilet_count||0)} toilets • ${Number(b.urinal_count||0)} urinals • ${Number(b.sink_count||0)} sinks</small></div>`).join(''):'<div class="subtask">No bathroom configuration yet.</div>'}</div>
   </div>
  </div>`);
 document.querySelectorAll('.checkcathead').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));
}

function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
$('modalClose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

$('menuBtn').onclick=()=>$('drawer').classList.add('open');
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');
$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')});
$('langEn').onclick=()=>{lang='en';localStorage.setItem('cleaning_ops_lang',lang);$('drawer').classList.remove('open');if(session)renderShell();else loginScreen()};
$('langEs').onclick=()=>{lang='es';localStorage.setItem('cleaning_ops_lang',lang);$('drawer').classList.remove('open');if(session)renderShell();else loginScreen()};
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();location.reload()};

supabase.auth.onAuthStateChange(async(_event,s)=>{session=s;if(!s){profile=null;loginScreen()}});
boot();
</script>
