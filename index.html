<script id="v92-menu-fix">
(function(){
  function installMenuFix(){
    const btn=document.getElementById('menuBtn');
    const drawer=document.getElementById('drawer');
    if(!btn || !drawer) return;

    // Remove the original inline handler so the repaired handler is authoritative.
    btn.onclick=null;

    const openMenu=function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      drawer.classList.add('open');
      drawer.style.display='';
      drawer.removeAttribute('aria-hidden');
    };

    btn.addEventListener('pointerup',openMenu,{passive:false});
    btn.addEventListener('touchend',openMenu,{passive:false});
    btn.addEventListener('click',openMenu);

    // Make the icon itself non-blocking and ensure the button is above the header.
    btn.style.pointerEvents='auto';
    btn.style.position='relative';
    btn.style.zIndex='10001';
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',installMenuFix);
  }else{
    installMenuFix();
  }
})();
</script>

async function signup(){
 const name=$('suName')?.value.trim(),email=$('suEmail')?.value.trim(),pass=$('suPass')?.value,confirm=$('suConfirm')?.value;
 if(!name||!email||!pass)return signupScreen('Please complete every field.');
 if(pass.length<6)return signupScreen('Password must be at least 6 characters.');
 if(pass!==confirm)return signupScreen('Passwords do not match.');
 $('createBtn').disabled=true;
 const {data,error}=await supabase.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
 if(error){$('createBtn').disabled=false;return signupScreen(error.message)}
 if(data.session){session=data.session;await boot()}else loginScreen('Account created. Check your email to confirm, then sign in.');
}
async function signIn(){
 const email=$('email')?.value.trim(),password=$('password')?.value;
 if(!email||!password)return toast('Enter your email and password');
 $('loginBtn').disabled=true;
 const {data,error}=await supabase.auth.signInWithPassword({email,password});
 if(error){$('loginBtn').disabled=false;return loginScreen(error.message)}
 session=data.session;await boot();
}
async function resetPassword(){
 const email=$('email')?.value.trim();if(!email)return toast('Enter your email first');
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 toast(error?error.message:'Password reset email sent');
}

async function boot(){
 const {data:{session:s}}=await supabase.auth.getSession();session=s;
 if(!session)return loginScreen();
 const {data:p,error}=await supabase.from('profiles').select('id,full_name,role,active,created_at').eq('id',session.user.id).single();
 if(error||!p)return loginScreen('Your account profile is not set up yet.');
 if(p.active===false){await supabase.auth.signOut();return loginScreen('This account is inactive.');}
 profile=p;
 await loadBase();
 renderShell();
 await showTab('home');
}

async function loadBase(){

function todayRestaurant(){return restaurants.find(r=>r.weekday===new Date().getDay()&&r.active!==false)||null}

async function loadToday(){
 assignment=null;tasks=[];timeEntry=null;photos=[];
 const r=todayRestaurant();if(!r)return;
 let q=supabase.from('employee_assignments').select('*').eq('restaurant_id',r.id).eq('work_date',localDate());
 if(!isManagement())q=q.eq('employee_id',session.user.id);
 const {data:a,error}=await q.order('created_at',{ascending:true});
 if(error)return;
 assignment=isManagement()?(a||[])[0]:(a||[])[0];
 if(!assignment)return;
 const t=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
 tasks=t.data||[];
 if(!tasks.length){
   const temp=await supabase.from('task_templates').select('name').eq('active',true).order('sort_order');
   if(temp.data?.length){
     await supabase.from('checklist_tasks').insert(temp.data.map(x=>({assignment_id:assignment.id,task_name:x.name,completed:false})));
     const tt=await supabase.from('checklist_tasks').select('id,task_name,completed,completed_at').eq('assignment_id',assignment.id).order('created_at');
     tasks=tt.data||[];
   }
 }
 if(!isManagement()){
   const te=await supabase.from('time_entries').select('id,clock_in,clock_out').eq('assignment_id',assignment.id).eq('employee_id',session.user.id).order('clock_in',{ascending:false}).limit(1);
   timeEntry=te.data?.[0]||null;
   const ph=await supabase.from('job_photos').select('id,photo_type,storage_path,created_at').eq('assignment_id',assignment.id).eq('employee_id',session.user.id).order('created_at',{ascending:false});
   photos=ph.data||[];
 }
}


async function mainAnnouncements(){
 try{
  const role=profile?.role||'employee';
  const {data,error}=await supabase.from('announcements')
   .select('id,title,body,audience,priority,created_at')
   .eq('active',true)
   .order('created_at',{ascending:false})
   .limit(20);
  if(error) return '';
  const items=(data||[]).filter(a=>{
   if(a.audience==='everyone')return true;
   if(a.audience==='employees')return role==='employee';
   if(a.audience==='managers')return role==='manager'||role==='owner';
   return false;
  }).slice(0,3);
  const badge=items.length?`<span class="announcement-badge">${items.length}</span>`:'';
  const rows=items.length?items.map(a=>`
   <div class="main-announcement ${a.priority==='urgent'?'urgent':''}">
    <div class="row">
     <div class="announcement-title">${esc(a.title)}</div>
     <span class="announcement-priority">${esc(String(a.priority||'normal').toUpperCase())}</span>
    </div>
    <div class="announcement-meta">${new Date(a.created_at).toLocaleDateString()}</div>
    <div class="announcement-body">${esc(a.body)}</div>
   </div>`).join(''):`<div class="muted">No announcements yet.</div>`;
  return `<div class="card announcement-card" style="margin-top:12px">
   <div class="row">
    <div><div class="tiny">UPDATES</div><h2 style="margin-top:3px">Announcements ${badge}</h2></div>
    <button class="btn secondary" id="mainAnnouncementsBtn" type="button" style="min-height:42px">View all</button>
   </div>
   <div style="margin-top:8px">${rows}</div>
  </div>`;
 }catch(e){return ''}
}

async function assignmentModal(empId){
 const firstActive=restaurants.find(r=>r.active!==false);
 openModal(T('assign'),`
  <div class="notice" style="margin-bottom:10px">
    Assigning a restaurant creates a recurring service schedule for the next 52 service weeks.
  </div>
  <div class="field"><label>${T('restaurants')}<select id="aRestaurant">${restaurants.filter(r=>r.active!==false).map(r=>`<option value="${r.id}">${esc(r.name)} • ${dayNames[r.weekday]} • ${fmtTime(r.start_time)}</option>`).join('')}</select></label></div>
  <div class="field"><label>Start date<input id="aDate" type="date" value="${localDate()}"></label></div>
  <div class="workflow-note" style="margin-top:8px">
    The app will automatically create each upcoming service date for the selected restaurant. The employee will only see the restaurant when its scheduled weekday arrives.
  </div>
  <button class="btn gold" id="saveAssignment">${T('assign')}</button>`);
 $('saveAssignment').onclick=async()=>{
  const restaurant_id=$('aRestaurant').value,start=$('aDate').value;
  if(!restaurant_id||!start)return toast('Restaurant and start date are required');

  const restaurant=restaurants.find(r=>r.id===restaurant_id);
  if(!restaurant)return toast('Restaurant not found');

  const targetDay=Number(restaurant.weekday);
  const startDate=new Date(start+'T12:00:00');
  if(Number.isNaN(startDate.getTime()))return toast('Invalid start date');

  // Find the first occurrence on/after the chosen start date that matches
  // the restaurant's configured weekday, then create 52 weekly service rows.
  const first=new Date(startDate);
  const delta=(targetDay-first.getDay()+7)%7;
  first.setDate(first.getDate()+delta);

  const dates=[];
  for(let i=0;i<52;i++){
    const d=new Date(first);
    d.setDate(first.getDate()+i*7);
    dates.push(d.toISOString().slice(0,10));
  }

  const existing=await supabase.from('employee_assignments')
    .select('work_date')
    .eq('employee_id',empId)
    .eq('restaurant_id',restaurant_id)
    .in('work_date',dates);

  if(existing.error)return toast(existing.error.message);
  const have=new Set((existing.data||[]).map(x=>x.work_date));
  const rows=dates.filter(d=>!have.has(d)).map(work_date=>({
    employee_id:empId,
    restaurant_id,
    work_date,
    status:'assigned'
  }));

  if(rows.length){
    const {error}=await supabase.from('employee_assignments').insert(rows);
    if(error)return toast(error.message);
  }

  toast(`Recurring assignment saved • ${dates.length} service weeks`);
  closeModal();
  await renderTeam();
 };
}

async function uploadPhotos(){
 if(!assignment)return toast('No assignment');
 const before=$('beforeFile')?.files?.[0],after=$('afterFile')?.files?.[0];
 if(!before&&!after)return toast('Choose a photo');
 for(const [type,file] of [['before',before],['after',after]]){
  if(!file)continue;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${session.user.id}/${assignment.id}/${type}-${Date.now()}.${ext}`;
  const up=await supabase.storage.from('job-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(up.error)return toast(up.error.message);
  const rec=await supabase.from('job_photos').insert({assignment_id:assignment.id,employee_id:session.user.id,photo_type:type,storage_path:path});
  if(rec.error)return toast(rec.error.message);
  await supabase.from('notifications').insert({type:'photo_uploaded',title:`${type} photo uploaded`,body:`${profile.full_name||'Employee'} uploaded a ${type} photo.`,related_id:assignment.id});
 }
 toast('Photos uploaded');await renderWork();
}

<script id="v95-announcements-js">
(function(){
  async function loadAnnouncements(){
    if(typeof supabase==='undefined') return [];
    const {data,error}=await supabase.from('announcements')
      .select('*')
      .eq('active',true)
      .order('created_at',{ascending:false});

  function announcementAudienceVisible(a){
    const role=(typeof profile!=='undefined'&&profile?.role)||'employee';
    if(a.audience==='everyone') return true;
    if(a.audience==='managers') return role==='manager'||role==='owner';

    const rows=items.length ? items.map(a=>`

      </div>
      ${rows}
    </section>`;
  };

  window.ownerAnnouncements=async function(){
    const role=(typeof profile!=='undefined'&&profile?.role)||'';
    if(role!=='owner') return toast('Owner access only');

    const items=await loadAnnouncements();
    const rows=items.map(a=>`
      <div class="announcement-item">
        <div class="announcement-title">${esc(a.title||'Announcement')}</div>
        <div class="announcement-meta">${String(a.priority||'normal').toUpperCase()} • ${a.audience||'everyone'} • ${new Date(a.created_at).toLocaleDateString()}</div>
        <div class="announcement-body">${esc(a.body||'')}</div>
        <button class="btn danger small" type="button" data-delete-announcement="${a.id}" style="margin-top:8px;width:auto">Delete</button>
      </div>`).join('');

    openModal('Announcements',`
      <div class="announcement-form">
        <input id="annTitle" placeholder="Title">
        <textarea id="annBody" placeholder="Write your announcement..."></textarea>
        <select id="annAudience">
          <option value="everyone">Everyone</option>
          <option value="employees">Employees</option>
          <option value="managers">Managers</option>
        </select>
        <select id="annPriority">
          <option value="normal">Normal</option>
          <option value="important">Important</option>
          <option value="urgent">Urgent</option>
        </select>
        <button class="btn gold" id="publishAnnouncement">Publish Announcement</button>
      </div>
      <div style="margin-top:18px">${rows||'<div class="muted">No announcements yet.</div>'}</div>`);

    document.querySelectorAll('[data-delete-announcement]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm('Delete this announcement?')) return;
      btn.disabled=true;
      const {error}=await supabase.from('announcements').delete().eq('id',btn.dataset.deleteAnnouncement);
      if(error){btn.disabled=false;return toast(error.message)}
      toast('Announcement deleted');
      closeModal();
      if(typeof render==='function') await render();
    });

    $('publishAnnouncement').onclick=async()=>{
      const title=$('annTitle').value.trim(),body=$('annBody').value.trim();
      if(!title||!body)return toast('Title and message are required');
      const {error}=await supabase.from('announcements').insert({

      if(error)return toast(error.message);
      toast('Announcement published');
      closeModal();
      if(typeof render==='function') await render();
    };
  };
})();
</script>

<script id="v98-daily-job-js">
(function(){
  async function getCurrentProfile98(){
    if(typeof supabase==='undefined') return null;
    const {data:{user}}=await supabase.auth.getUser();
    if(!user)return null;
    const {data}=await supabase.from('profiles')
      .select('id,full_name,role,active')
      .eq('id',user.id).maybeSingle();
    return data||null;
  }

  function todayLocal98(){
    const d=new Date();
    return d.toISOString().slice(0,10);
  }

  async function ensureTodayJob98(profile){
    const today=todayLocal98();
    const dow=new Date(today+'T12:00:00').getDay();

    // Employee has access to all active restaurants. The schedule selects
    // today's restaurant; no recurring employee-to-restaurant assignment is required.
    const {data:restaurant,error:re}=await supabase.from('restaurants')
      .select('*').eq('active',true).eq('weekday',dow)
      .order('name').limit(1).maybeSingle();

    if(re||!restaurant)return {restaurant:null,assignment:null};

    let {data:assignment,error:ae}=await supabase.from('employee_assignments')
      .select('*')
      .eq('employee_id',profile.id)
      .eq('restaurant_id',restaurant.id)
      .eq('work_date',today)
      .limit(1).maybeSingle();

    if(ae)return {restaurant,assignment:null,error:ae};

    if(!assignment){
      const ins=await supabase.from('employee_assignments').insert({
        employee_id:profile.id,
        restaurant_id:restaurant.id,
        work_date:today,
        status:'assigned'
      }).select('*').single();
      if(!ins.error)assignment=ins.data;
      else return {restaurant,assignment:null,error:ins.error};
    }
    return {restaurant,assignment};
  }

  async function renderDailyJob98(){
    const profile=await getCurrentProfile98();
    if(!profile || profile.role!=='employee' || profile.active===false)return;

    const content=document.getElementById('content');
    if(!content)return;

    const result=await ensureTodayJob98(profile);
    const old=document.getElementById('dailyJob98');
    if(old)old.remove();

    const wrap=document.createElement('section');
    wrap.id='dailyJob98';
    wrap.className='card daily-job';

    if(!result.restaurant){
      wrap.innerHTML=`
        <div class="eyebrow">TODAY'S SERVICE</div>
        <h3>No service scheduled today</h3>
        <div class="muted">There is no active restaurant scheduled for today.</div>`;
      content.prepend(wrap);
      return;
    }

    const r=result.restaurant, a=result.assignment;
    const dayNames98=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const timeLabel=(typeof fmtTime==='function')?fmtTime(r.start_time):(r.start_time||'');
    const status=a?.status||'assigned';

    // Pull today's time entry for this employee/job.
    const {data:entry}=await supabase.from('time_entries')
      .select('*')
      .eq('employee_id',profile.id)
      .eq('restaurant_id',r.id)
      .eq('work_date',todayLocal98())
      .order('clock_in',{ascending:false})
      .limit(1).maybeSingle();

    const clocked=!!entry?.clock_in && !entry?.clock_out;

    wrap.innerHTML=`
      <div class="eyebrow">TODAY'S SERVICE</div>
      <h3>${typeof esc==='function'?esc(r.name):r.name}</h3>
      <div class="daily-job-grid">
        <div class="daily-job-meta">
          <div><div class="daily-job-label">Schedule</div><div class="daily-job-value">${dayNames98[r.weekday]||''} • ${timeLabel}</div></div>
          <div><div class="daily-job-label">Status</div><div class="daily-status"><span class="daily-dot ${clocked?'on':''}"></span>${clocked?'Clocked in':'Ready to clock in'}</div></div>
        </div>
        ${clocked?`<div class="daily-job-label">Clocked in at <span class="daily-job-value daily-time">${new Date(entry.clock_in).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div>`:''}
        <div class="daily-job-actions">
          <button class="btn gold" id="dailyClock98" type="button">${clocked?'Clock Out':'Clock In'}</button>
          <button class="btn secondary" id="dailyChecklist98" type="button">Open Checklist</button>
        </div>
      </div>`;

    const clock=document.getElementById('dailyClock98');
    const checklist=document.getElementById('dailyChecklist98');

    if(clock){
      clock.onclick=async()=>{
        clock.disabled=true;
        if(!clocked){
          const {error}=await supabase.from('time_entries').insert({
            employee_id:profile.id,
            restaurant_id:r.id,
            work_date:todayLocal98(),
            clock_in:new Date().toISOString()
          });
          if(error)alert(error.message);
          else if(typeof render==='function')await render();
        }else{
          const {error}=await supabase.from('time_entries').update({
            clock_out:new Date().toISOString()
          }).eq('id',entry.id);
          if(error)alert(error.message);
          else if(typeof render==='function')await render();
        }
        clock.disabled=false;
      };
    }

    if(checklist){
      checklist.onclick=()=>{
        const target=document.querySelector('[data-screen="home-checklist"],#checklistBtn,#startChecklistBtn');
        if(target)target.click();
        else if(typeof toast==='function')toast('Checklist is ready for today.');
      };
    }

    content.prepend(wrap);
  }

  // Run after the app has rendered its normal Home screen. A MutationObserver
  // catches navigation/rerenders without replacing existing app functions.
  function install98(){
    const content=document.getElementById('content');
    if(!content)return;
    let queued=false;
    const schedule=()=>{
      if(queued)return;
      queued=true;
      setTimeout(()=>{queued=false;renderDailyJob98()},120);
    };
    new MutationObserver(schedule).observe(content,{childList:true,subtree:false});
    setTimeout(renderDailyJob98,250);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install98);
  else install98();
})();
</script>
