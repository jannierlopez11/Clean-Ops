<style>
:root{--bg:#050a11;--navy:#091525;--navy2:#0d1c2e;--gold:#e7bf7a;--gold2:#f3d39b;--cream:#f4eee4;--muted:#9ba8b8;--line:#26384a;--card:rgba(10,25,42,.82);--danger:#d77b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#13243a 0,#07111d 35%,#050a11 70%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;min-height:100vh}.hero{padding:42px 22px 24px;background:linear-gradient(180deg,rgba(6,15,27,.96),rgba(7,18,31,.9));border-bottom:1px solid #1d3044}.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:.38em;font-size:24px;color:var(--gold2);font-weight:700}.eyebrow{margin-top:8px;font-size:10px;letter-spacing:.34em;color:#d7dce3}.heroRow{display:flex;justify-content:space-between;align-items:center}.role{margin-top:16px;font-size:11px;letter-spacing:.25em;color:var(--gold2);text-transform:uppercase}.main{padding:18px 15px 105px}.card{background:linear-gradient(145deg,rgba(13,31,50,.92),rgba(7,19,32,.9));border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 14px 35px rgba(0,0,0,.18)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--cream);letter-spacing:.12em}h2{font-size:23px}h3{font-size:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:13px}.tiny{font-size:10px;letter-spacing:.2em;text-transform:uppercase}.place{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:.18em;color:var(--cream)}.time{margin-top:5px;color:var(--muted);letter-spacing:.16em;font-size:12px}.badge{border:1px solid rgba(231,191,122,.55);color:var(--gold2);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.progress{height:8px;background:#17283a;border-radius:99px;overflow:hidden;margin:17px 0 8px}.bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:.25s}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.quick button{min-height:92px;border:1px solid var(--line);background:rgba(10,25,42,.72);border-radius:18px;color:var(--cream);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:10px 5px}.quick button .ico{display:block;font-size:25px;color:var(--gold2);margin-bottom:8px}.quick button:active,.quick button.active{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#07111c;border-color:var(--gold2);transform:scale(.985)}.btn{width:100%;min-height:46px;border:1px solid rgba(231,191,122,.55);border-radius:14px;background:transparent;color:var(--gold2);font-weight:800;letter-spacing:.16em;text-transform:uppercase}.btn:active,.btn.gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#07111c;border-color:var(--gold2)}.btn.secondary{border-color:var(--line);color:var(--cream)}.btn:disabled{opacity:.35}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.task{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.14em;text-transform:uppercase}.task:last-child{border-bottom:0}.task input{appearance:none;width:23px;height:23px;border:2px solid #9da8b4;border-radius:8px;background:transparent;flex:0 0 auto}.task input:checked{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 4px #0a1828}.task.done span{text-decoration:line-through;color:#7e8996}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photoBox{border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;background:rgba(5,15,26,.5)}.photoIcon{font-size:28px;color:var(--gold2);margin-bottom:10px}.photoBox strong{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase}.photoBox input{display:none}.photoBox label{display:inline-block;margin-top:13px;padding:9px 12px;border:1px solid rgba(231,191,122,.5);border-radius:999px;color:var(--gold2);font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}.thumb{width:100%;height:115px;object-fit:cover;border-radius:12px;margin-top:12px;display:none}.field{margin:12px 0}.field label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.field input,.field select{width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#071321;color:var(--cream);font-size:16px;outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.employee{padding:13px;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;background:rgba(5,12,20,.97);border-top:1px solid #203449;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(12px)}.nav button{border:0;background:none;color:#8d9aaa;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:7px 8px;min-width:74px}.nav button .navico{display:block;font-size:21px;letter-spacing:0;margin-bottom:4px}.nav button.active{color:var(--gold2)}.nav button:active{color:var(--gold);background:rgba(231,191,122,.1);border-radius:12px}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:15px 0}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--gold);color:#06111c;padding:11px 16px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.1em;z-index:50;box-shadow:0 10px 30px #0008}.loginBox{text-align:center;padding-top:15vh}.loginBox .brand{font-size:28px}.loginBox p{color:var(--muted);font-size:13px}.stat{font-family:Georgia,"Times New Roman",serif;font-size:28px;color:var(--gold2)}
@media(max-width:390px){.brand{font-size:20px}.quick button{min-height:82px;font-size:8px}.quick button .ico{font-size:22px}.place{font-size:24px}.photoGrid{grid-template-columns:1fr}}
</style>

<style id="co-polished-ui">
/* CLEANING OPS — compact polished UI */
:root{
  --co-navy:#0b0f18;
  --co-panel:#121824;
  --co-panel2:#171e2b;
  --co-gold:#d4ae4c;
  --co-cream:#f5ead6;
  --co-muted:#9ca3af;
}
*{box-sizing:border-box}
html,body{font-size:15px}
body{overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{transition:.15s ease}
button:active{transform:scale(.98)}

/* Make the overall app feel like a real mobile product */
.container,.app-container,.page,.screen,.content,.main-content{
  max-width:760px!important;
}
main,.content,.page{padding-left:14px!important;padding-right:14px!important}
h1{font-size:22px!important;line-height:1.15!important}
h2{font-size:18px!important}
h3{font-size:15px!important}
p{font-size:13px!important;line-height:1.45!important}
.card,.panel,.section,.restaurant-card{
  border-radius:15px!important;
  padding:13px!important;
  margin-bottom:10px!important;
}
input,select,textarea{
  min-height:42px!important;
  border-radius:11px!important;
  font-size:14px!important;
}
button{
  min-height:40px!important;
  border-radius:11px!important;
  font-size:13px!important;
}

/* Header */
.co-topbar{
  position:sticky;top:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  min-height:56px;padding:8px 14px;
  background:rgba(11,15,24,.96);
  border-bottom:1px solid rgba(212,174,76,.20);
  backdrop-filter:blur(14px);
}
.co-brand{display:flex;align-items:center;gap:9px;min-width:0}
.co-brand-mark{
  width:30px;height:30px;border-radius:9px;

  border:1px solid rgba(212,174,76,.55);
  color:var(--co-gold);font-weight:800;font-size:12px;
}
.co-brand-text{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--co-cream);white-space:nowrap}
.co-menu{
  width:38px!important;height:38px!important;min-height:38px!important;
  padding:7px!important;border:1px solid rgba(212,174,76,.35)!important;

}
.co-menu span{display:block;width:17px;height:2px;background:currentColor;border-radius:2px}

/* Compact navigation */
nav,.bottom-nav,.tabbar{
  gap:5px!important;
}

  padding:8px 7px!important;
  font-size:11px!important;
}

/* Detailed checklist */
#detailedChecklistWrap{margin-top:12px!important}
.co-progress-card{padding:12px!important;border-radius:14px!important;margin-bottom:9px!important}
.co-progress-top strong{font-size:10px!important}
#detailedProgress{font-size:11px!important}
.co-progress-track{height:5px!important;margin-top:8px!important}
.co-detail-category{border-radius:13px!important;margin:7px 0!important}
.co-cat-head{padding:11px!important;grid-template-columns:27px 1fr 18px!important;gap:7px!important}
.co-cat-icon{font-size:17px!important}
.co-cat-head b{font-size:11px!important;letter-spacing:.06em}
.co-cat-head small{font-size:8px!important;margin-top:2px!important}
.co-cat-body{padding:0 9px 9px!important}
.co-detail-item{padding:9px 3px!important}
.co-item-title{font-size:12px!important}
.co-item-desc{font-size:8px!important}
.co-detail-row{
  gap:8px!important;margin-top:6px!important;padding:8px 9px!important;
  border-radius:9px!important;font-size:12px!important;
}

/* Hide any oversized decorative elements from older versions */
img.logo,.logo img{max-height:42px!important;width:auto!important}
</style>

<body><div class="app">
<header class="hero"><div class="heroRow"><div><div class="brand">CLEANING OPS</div><div class="eyebrow">RESTAURANT CLEANING MANAGEMENT</div></div><div style="color:var(--gold2);font-size:28px">◯</div></div><div class="role" id="heroSub">Manager • User</div></header>
<main class="main"><section id="login"><div class="loginBox"><div class="brand">CLEANING OPS</div><p>Clean work. Clear standards.</p><div class="card" style="margin-top:25px;text-align:left"><div class="field"><label>Your name<input id="name" placeholder="Enter your name"></label></div><div class="grid2"><button class="btn" data-login="manager">Manager</button><button class="btn secondary" data-login="employee">Employee</button></div></div></div></section>
<section id="app" class="hidden"><div id="dashboard"></div><div id="availability" class="hidden"></div><div id="photos" class="hidden"></div><div id="employees" class="hidden"></div><div id="settings" class="hidden"></div></section></main><nav id="nav" class="nav hidden"></nav></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://uwfoqbyejrfrgiwftvli.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_fKXaIcoTfnQ8joXp3VM_YA_1u82btt1';

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const DEFAULT_TASKS = [
  'Grills / Parrillas','Fryers','Hoods','Floors',
  'Equipment','Walls','Trash Area','Final Inspection'
];

let session = null;
let profile = null;
let restaurants = [];
let employees = [];
let currentAssignment = null;
let currentTasks = [];
let currentPhotos = {before:null, after:null};
let currentTimeEntry = null;
let tab = 'dashboard';
let working = false;

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const localDateISO = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
};
const dayName = d => new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(d);
const formatTime = t => {
  if (!t) return '';
  const [h,m] = String(t).slice(0,5).split(':').map(Number);
  const x = new Date(); x.setHours(h,m,0,0);
  return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(x);
};
const toast = t => {
  const x=document.createElement('div'); x.className='toast'; x.textContent=t;
  document.body.appendChild(x); setTimeout(()=>x.remove(),2200);
};
const isManager = () => profile?.role === 'manager';

function loginScreen(message='') {
  $('login').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('nav').classList.add('hidden');
  $('login').innerHTML = `
    <div class="loginBox">
      <div class="brand">CLEANING OPS</div>
      <p>Restaurant Cleaning Management</p>
      <div class="card" style="margin-top:25px;text-align:left">
        ${message ? `<div class="employee" style="border-color:rgba(215,123,123,.5);margin-bottom:14px">${escapeHtml(message)}</div>` : ''}
        <div class="field"><label>Email<input id="email" type="email" autocomplete="username" placeholder="name@email.com"></label></div>
        <div class="field"><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label></div>
        <button class="btn gold" id="loginBtn">Sign In</button>
        <button class="btn secondary" id="signupBtn" style="margin-top:10px">Employee Sign Up</button>
        <button class="btn secondary" id="resetBtn" style="margin-top:10px">${tr('forgot')}</button>
        <button class="btn secondary" id="loginLangBtn" style="margin-top:10px">🌐 ${lang==='es'?'English':'Español'}</button>
        <div class="muted" style="text-align:center;font-size:12px;margin-top:14px">
          Employees create their own account. Your manager will assign your restaurant and schedule after signup.
        </div>
      </div>
    </div>`;
  $('loginBtn').onclick = signIn;
  $('signupBtn').onclick = signupScreen;
  $('resetBtn').onclick = resetPassword;
  $('loginLangBtn').onclick = ()=>{
    lang = lang==='en'?'es':'en';
    localStorage.setItem('cleaning_ops_lang',lang);
    loginScreen();
  };
}

function signupScreen(message='') {
  $('login').innerHTML = `
    <div class="loginBox">
      <div class="brand">CLEANING OPS</div>
      <p>Create your employee account</p>
      <div class="card" style="margin-top:25px;text-align:left">
        ${message ? `<div class="employee" style="border-color:rgba(215,123,123,.5);margin-bottom:14px">${escapeHtml(message)}</div>` : ''}
        <div class="field"><label>Full Name<input id="signupName" type="text" autocomplete="name" placeholder="Your full name"></label></div>
        <div class="field"><label>Email<input id="signupEmail" type="email" autocomplete="email" placeholder="name@email.com"></label></div>
        <div class="field"><label>Password<input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label></div>
        <div class="field"><label>Confirm Password<input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password"></label></div>
        <button class="btn gold" id="createAccountBtn">Create Employee Account</button>
        <button class="btn secondary" id="backLoginBtn" style="margin-top:10px">${tr('backSignIn')}</button>
        <button class="btn secondary" id="signupLangBtn" style="margin-top:10px">🌐 ${lang==='es'?'English':'Español'}</button>
      </div>
    </div>`;
  $('createAccountBtn').onclick = signUp;
  $('backLoginBtn').onclick = () => loginScreen();
  $('signupLangBtn').onclick = ()=>{
    lang = lang==='en'?'es':'en';
    localStorage.setItem('cleaning_ops_lang',lang);
    signupScreen();
  };
}

async function signUp() {
  const name = $('signupName')?.value.trim();
  const email = $('signupEmail')?.value.trim();
  const password = $('signupPassword')?.value;
  const confirm = $('signupConfirm')?.value;
  if (!name || !email || !password) return signupScreen('Please complete every field.');
  if (password.length < 6) return signupScreen('Password must be at least 6 characters.');
  if (password !== confirm) return signupScreen('Passwords do not match.');

  $('createAccountBtn').disabled = true;
  const {data,error} = await supabase.auth.signUp({
    email,
    password,
    options: { data: { full_name: name } }
  });
  $('createAccountBtn').disabled = false;

  if (error) return signupScreen(error.message);

  if (data.session) {
    session = data.session;
    await boot();
  } else {
    loginScreen('Account created! Check your email to confirm your account, then sign in.');
  }
}

async function signIn() {
  const email = $('email')?.value.trim();
  const password = $('password')?.value;
  if (!email || !password) return toast('Enter your email and password');
  $('loginBtn').disabled = true;
  const {data,error} = await supabase.auth.signInWithPassword({email,password});
  $('loginBtn').disabled = false;
  if (error) return loginScreen(error.message);
  session = data.session;
  await boot();
}

async function resetPassword() {
  const email = $('email')?.value.trim();
  if (!email) return toast('Enter your email first');
  const {error} = await supabase.auth.resetPasswordForEmail(email,{
    redirectTo: window.location.origin + window.location.pathname
  });
  toast(error ? error.message : 'Password reset email sent');
}

async function boot() {
  const {data:{session:s}} = await supabase.auth.getSession();
  session = s;
  if (!session) return loginScreen();

  const {data:p,error:pe} = await supabase.from('profiles')
    .select('id,full_name,role,active').eq('id',session.user.id).single();

  if (pe || !p) return loginScreen('Your account profile is not set up yet.');
  if (p.active === false) {
    await supabase.auth.signOut();
    return loginScreen('This account is inactive. Contact your manager.');
  }
  profile = p;
  await loadBaseData();
  renderShell();
  await loadToday();
  show('dashboard');
}

async function loadBaseData() {
  const r = await supabase.from('restaurants')
    .select('id,name,weekday,start_time,active')
    .eq('active',true).order('weekday').order('name');
  if (!r.error) restaurants = r.data || [];

  if (isManager()) {
    const e = await supabase.from('profiles')
      .select('id,full_name,role,active')
      .eq('role','employee').order('full_name');
    if (!e.error) employees = e.data || [];
  }
}

function renderShell() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('nav').classList.remove('hidden');
  $('heroSub').textContent = `${isManager()?'Manager':'Employee'} • ${profile.full_name || session.user.email}`;
  // Make the v4 top-right circle a settings button.
  const settingsCircle = document.querySelector('.hero .circle, header .circle, .topCircle');
  if (settingsCircle) {
    settingsCircle.textContent = '⚙';
    settingsCircle.setAttribute('aria-label','Settings');
    settingsCircle.style.cursor='pointer';
    settingsCircle.onclick=()=>show('settings');
  }
  $('nav').innerHTML = isManager()
    ? `<button data-tab="dashboard"><span class="navico">⌂</span>${tr('dashboard')}</button>
       <button data-tab="availability"><span class="navico">◷</span>${tr('schedule')}</button>
       <button data-tab="employees"><span class="navico">♙</span>${tr('employees')}</button>
       <button data-tab="photos"><span class="navico">⌾</span>${tr('photos')}</button>`
    : `<button data-tab="dashboard"><span class="navico">⌂</span>${lang==='es'?'Mi trabajo':'My Job'}</button>
       <button data-tab="availability"><span class="navico">◷</span>${tr('schedule')}</button>
       <button data-tab="photos"><span class="navico">⌾</span>${tr('photos')}</button>`;
  document.querySelectorAll('#nav [data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
}

function show(t) {
  tab=t;
  ['dashboard','availability','photos','employees','settings'].forEach(x=>{
    const el=$(x);
    if(el) el.classList.toggle('hidden',x!==t);
  });
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  render();
}

async function render() {
  if (tab==='dashboard') await renderDash();
  if (tab==='availability') await renderSchedule();
  if (tab==='photos') await renderPhotos();
  if (tab==='employees') await renderEmployees();
  if (tab==='settings') await renderSettings();
}

function quick() {
  return `<div class="quick">
    <button data-tabq="dashboard"><span class="ico">☷</span>Checklist</button>
    <button data-tabq="availability"><span class="ico">◷</span>Schedule</button>
    ${isManager()?'<button data-tabq="employees"><span class="ico">♙</span>Employees</button>':''}
    <button data-tabq="photos"><span class="ico">⌾</span>Photos</button>
    <button data-tabq="settings"><span class="ico">⚙</span>${tr('settings')}</button>
  </div>`;
}

function todayRestaurant() {
  const dow = new Date().getDay(); // Sunday 0, Monday 1...
  return restaurants.find(r=>r.weekday===dow) || null;
}

async function loadToday() {
  const restaurant = todayRestaurant();
  if (!restaurant) {
    currentAssignment=null; currentTasks=[]; currentTimeEntry=null;
    return;
  }
  const date = localDateISO();

  let aq = supabase.from('employee_assignments')
    .select('id,restaurant_id,employee_id,work_date,status')
    .eq('restaurant_id',restaurant.id).eq('work_date',date);

  if (!isManager()) aq = aq.eq('employee_id',session.user.id);

  const {data:assignments,error} = await aq.order('created_at');
  if (error) { toast(error.message); return; }

  currentAssignment = isManager()
    ? (assignments?.[0] || null)
    : (assignments?.find(a=>a.employee_id===session.user.id) || null);

  if (currentAssignment) {
    const {data:tasks} = await supabase.from('checklist_tasks')
      .select('id,task_name,completed,completed_at')
      .eq('assignment_id',currentAssignment.id).order('created_at');
    currentTasks = tasks || [];

    if (!currentTasks.length) {
      const {data:templates} = await supabase.from('task_templates')
        .select('name').eq('active',true).order('sort_order');
      const names=(templates||[]).map(x=>x.name);
      if (names.length) {
        const rows=names.map(name=>({assignment_id:currentAssignment.id,task_name:name,completed:false}));
        await supabase.from('checklist_tasks').insert(rows);
        const {data:created}=await supabase.from('checklist_tasks')
          .select('id,task_name,completed,completed_at')
          .eq('assignment_id',currentAssignment.id).order('created_at');
        currentTasks=created||[];
      }
    }

    const {data:te}=await supabase.from('time_entries')
      .select('id,clock_in,clock_out')
      .eq('assignment_id',currentAssignment.id)
      .eq('employee_id',session.user.id)
      .order('clock_in',{ascending:false}).limit(1);
    currentTimeEntry=te?.[0]||null;

    const {data:ph}=await supabase.from('job_photos')
      .select('id,photo_type,storage_path,created_at')
      .eq('assignment_id',currentAssignment.id)
      .eq('employee_id',session.user.id)
      .order('created_at',{ascending:false});
    currentPhotos={before:ph?.find(x=>x.photo_type==='before')||null,
                   after:ph?.find(x=>x.photo_type==='after')||null};
  }
}

async function renderDash() {
  await loadToday();
  const s=todayRestaurant();
  if (!s) {
    $('dashboard').innerHTML=quick()+`<div class="card"><div class="tiny muted">Today</div><h2>NO RESTAURANT SCHEDULED</h2><p class="muted">There is no active restaurant scheduled for today.</p></div>`;
    bindQuick(); return;
  }

  const done=currentTasks.filter(x=>x.completed).length;
  const total=currentTasks.length || DEFAULT_TASKS.length;
  const pct=total?Math.round(done/total*100):0;
  const status=currentAssignment?.status || 'Not Assigned';

  let assignedText='Not assigned';
  if (currentAssignment) {
    if (isManager()) {
      const emp=employees.find(e=>e.id===currentAssignment.employee_id);
      assignedText=emp?.full_name || 'Employee';
    } else assignedText=profile.full_name || 'You';
  }

  const clockedIn=!!currentTimeEntry && !currentTimeEntry.clock_out;
  $('dashboard').innerHTML=quick()+`
    <div class="card">
      <div class="row"><div><div class="tiny muted">Today</div><div class="place">${escapeHtml(s.name)}</div>
      <div class="time">${dayName(new Date()).toUpperCase()} • ${formatTime(s.start_time)}</div></div>
      <span class="badge">${pct===100&&currentAssignment?'Complete':status}</span></div>
      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      <div class="row"><span class="muted">${done}/${total} TASKS COMPLETED</span><span class="stat">${pct}%</span></div>
    </div>

    <div class="card">
      <div class="row"><h2 style="margin:0">TODAY’S ASSIGNMENT</h2><span class="muted">•••</span></div>
      <div class="divider"></div>
      <div class="row"><div><div class="tiny muted">Assigned employee</div>
      <div style="font-size:18px;margin-top:5px">${escapeHtml(assignedText)}</div></div>
      ${isManager()?'<button class="btn" id="assignBtn" style="width:auto;padding:0 14px;min-height:38px">Assign</button>':''}</div>
      ${!isManager() && currentAssignment ? `<button class="btn ${clockedIn?'secondary':'gold'}" id="clockBtn" style="margin-top:15px">${clockedIn?'Clock Out':'Clock In'}</button>`:''}
    </div>

    ${currentAssignment?`<div class="card"><div class="row"><h2 style="margin:0">CLEANING CHECKLIST</h2><span class="stat">${done}/${total}</span></div>
      ${currentTasks.map((x,i)=>`<label class="task ${x.completed?'done':''}">
        <input type="checkbox" data-task="${x.id}" ${x.completed?'checked':''} ${isManager()?'disabled':''}>
        <span>${escapeHtml(x.task_name)}</span><span style="margin-left:auto;color:var(--gold2)">›</span>
      </label>`).join('')}
      ${!isManager()?`<button class="btn ${pct===100?'gold':''}" id="complete" style="margin-top:16px" ${pct<100?'disabled':''}>Complete Job</button>`:''}
    </div>`:
    `<div class="card"><div class="tiny muted">Assignment</div><h2>WAITING FOR ASSIGNMENT</h2><p class="muted">${isManager()?'Assign an employee to this restaurant for today.':'Your manager has not assigned you to this restaurant yet.'}</p></div>`}`;

  bindQuick();
  document.querySelectorAll('[data-task]').forEach(c=>c.onchange=async e=>{
    const id=e.target.dataset.task;
    const completed=e.target.checked;
    const {error}=await supabase.from('checklist_tasks').update({
      completed, completed_at:completed?new Date().toISOString():null
    }).eq('id',id);
    if(error){toast(error.message);return}
    await loadToday(); await renderDash(); toast(completed?'Task completed':'Task reopened');
  });

  const cb=$('clockBtn');
  if(cb) cb.onclick=clockToggle;

  const complete=$('complete');
  if(complete) complete.onclick=completeJob;

  const ab=$('assignBtn');
  if(ab) ab.onclick=assignEmployee;
}

function bindQuick(){
  document.querySelectorAll('[data-tabq]').forEach(b=>b.onclick=()=>show(b.dataset.tabq));
}

async function clockToggle(){
  if(!currentAssignment) return toast('No assignment yet');
  if(currentTimeEntry && !currentTimeEntry.clock_out){
    const {error}=await supabase.from('time_entries').update({clock_out:new Date().toISOString()}).eq('id',currentTimeEntry.id);
    if(error)return toast(error.message);
    toast('Clocked out ✓');
  } else {
    const {error}=await supabase.from('time_entries').insert({
      assignment_id:currentAssignment.id, employee_id:session.user.id, clock_in:new Date().toISOString()
    });
    if(error)return toast(error.message);
    toast('Clocked in ✓');
  }
  await renderDash();
}

async function completeJob(){
  if(!currentAssignment) return;
  if(currentTasks.some(x=>!x.completed)) return toast('Finish every task first');
  const {error}=await supabase.from('employee_assignments').update({status:'completed'}).eq('id',currentAssignment.id);
  if(error)return toast(error.message);
  await supabase.from('notifications').insert({
    type:'job_completed',
    title:'Job completed',
    body:`${profile.full_name||'Employee'} completed ${todayRestaurant()?.name||'the restaurant'}.`,
    related_id:currentAssignment.id
  });
  toast('Job completed ✓');
  await renderDash();
}

async function assignEmployee(){
  if(!employees.length) return toast('Add an employee first');
  const choices=employees.map((e,i)=>`${i+1}. ${e.full_name||e.id}`).join('\n');
  const n=prompt(`Choose employee number:\n${choices}`);
  const idx=Number(n)-1;
  if(!Number.isInteger(idx)||!employees[idx]) return;
  const r=todayRestaurant(); if(!r)return;
  const {data:existing}=await supabase.from('employee_assignments')
    .select('id').eq('restaurant_id',r.id).eq('work_date',localDateISO()).eq('employee_id',employees[idx].id).maybeSingle();
  if(existing) return toast('Employee already assigned');
  const {data,error}=await supabase.from('employee_assignments').insert({
    restaurant_id:r.id, employee_id:employees[idx].id, work_date:localDateISO(), status:'assigned'
  }).select().single();
  if(error)return toast(error.message);
  currentAssignment=data;
  toast(`${employees[idx].full_name} assigned ✓`);
  await renderDash();
}

async function uploadPhotos(){
  const before=$('before')?.files?.[0], after=$('after')?.files?.[0];

  for (const [type,file] of [['before',before],['after',after]]) {

    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${session.user.id}/${currentAssignment.id}/${type}-${Date.now()}.${ext}`;
    const {error:ue}=await supabase.storage.from('job-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});

    const {error:ie}=await supabase.from('job_photos').insert({
      assignment_id:currentAssignment.id, employee_id:session.user.id, photo_type:type, storage_path:path

      body:`${profile.full_name||'Employee'} uploaded a ${type} photo.`,

<script>
/* Cleaning Ops — Detailed Checklist Engine v5
   Connects the employee checklist to:
   checklist_categories -> checklist_items -> checklist_subtasks
   restaurant_checklist_items -> restaurant_bathrooms -> cleaning_rotations
*/
(function () {
  const CO = window.CleaningOpsDetailed = {
    loaded: false,
    categories: [],
    items: [],
    subtasks: [],
    restaurantItems: [],
    bathrooms: [],
    rotations: [],
    completed: new Set(),
    async load() {
      if (!window.supabase || !window.supabaseClient) return false;
      try {
        const sb = window.supabaseClient;
        const [c,i,s,ri,b,r] = await Promise.all([
          sb.from('checklist_categories').select('*').eq('active', true).order('sort_order'),
          sb.from('checklist_items').select('*').eq('active', true).order('sort_order'),
          sb.from('checklist_subtasks').select('*').eq('active', true).order('sort_order'),
          sb.from('restaurant_checklist_items').select('*').eq('active', true),
          sb.from('restaurant_bathrooms').select('*').eq('active', true),
          sb.from('cleaning_rotations').select('*').eq('active', true)
        ]);
        const err = [c,i,s,ri,b,r].find(x => x.error);
        if (err) throw err.error;
        this.categories = c.data || [];
        this.items = i.data || [];
        this.subtasks = s.data || [];
        this.restaurantItems = ri.data || [];
        this.bathrooms = b.data || [];
        this.rotations = r.data || [];
        this.loaded = true;
        return true;
      } catch (e) {
        console.warn('Detailed checklist load:', e);
        return false;
      }
    },
    restaurantId() {
      const r = window.currentRestaurant || window.selectedRestaurant || window.todayRestaurant;
      return r && (r.id || r.restaurant_id);
    },
    build(restaurantId) {
      const rid = restaurantId || this.restaurantId();
      let items = this.items.filter(x =>
        !this.restaurantItems.length ||
        this.restaurantItems.some(ri => ri.restaurant_id === rid && ri.item_id === x.id)
      );
      if (!items.length) items = this.items.slice();

      const byCat = {};
      this.categories.forEach(c => byCat[c.id] = {
        id:c.id, name:c.name, icon:c.icon || '🧽', sort:c.sort_order || 0, items:[]
      });
      items.forEach(item => {
        const c = byCat[item.category_id];
        if (!c) return;
        c.items.push({
          ...item,
          subtasks: this.subtasks.filter(s => s.item_id === item.id)
        });
      });
      let cats = Object.values(byCat).filter(c => c.items.length).sort((a,b)=>a.sort-b.sort);

      // Bathrooms are always included when configured, regardless of rotation.
      const bath = this.bathrooms.filter(b => !rid || b.restaurant_id === rid);
      if (bath.length) {
        const c = {
          id:'__bathrooms__', name:'BAÑOS / BATHROOMS', icon:'🚻', sort:99999, mandatory:true, items:[]
        };
        bath.forEach((b, bi) => {
          const toilets = Number(b.toilet_count || 0);
          const urinals = Number(b.urinal_count || 0);
          const sinks = Number(b.sink_count || 1);
          const base = [
            'Toilets', 'Urinals', 'Sinks', 'Faucets', 'Mirrors',
            'Soap Dispensers', 'Paper Towel Dispensers', 'Hand Dryers',
            'Bathroom Floors', 'Walls', 'Doors', 'Door Handles',
            'Trash Cans', 'Baseboards', 'Vents', 'High-Touch Areas', 'Supplies Check'
          ];
          const subs = [];
          for(let n=1;n<=Math.max(1,toilets);n++) subs.push({id:`bath-${b.id}-toilet-${n}`, name:`Toilet #${n}`, required:true});
          for(let n=1;n<=urinals;n++) subs.push({id:`bath-${b.id}-urinal-${n}`, name:`Urinal #${n}`, required:true});
          for(let n=1;n<=sinks;n++) subs.push({id:`bath-${b.id}-sink-${n}`, name:`Sink #${n}`, required:true});
          base.slice(3).forEach(x => subs.push({id:`bath-${b.id}-${x}`, name:x, required:true}));
          c.items.push({
            id:`bath-${b.id}`, name:b.name || `Bathroom #${bi+1}`,
            description:'MANDATORY EVERY SERVICE DAY', required:true, subtasks:subs
          });
        });
        cats.push(c);
      }
      return cats;
    },
    key(id){ return `co-detail-${id}`; },
    restore(){
      try {
        document.querySelectorAll('[data-co-check]').forEach(el => {
          if(localStorage.getItem(this.key(el.dataset.coCheck)) === '1') {
            el.checked = true;
            el.closest('.co-detail-row')?.classList.add('done');
          }
        });
      } catch(e){}
    },
    render(restaurantId) {
      const host = document.querySelector('#detailedChecklistHost');
      if (!host) return;
      const cats = this.build(restaurantId);
      if (!cats.length) {
        host.innerHTML = '<div class="co-empty">No detailed checklist is configured for this restaurant yet.</div>';
        return;
      }
      host.innerHTML = cats.map(cat => `
        <section class="co-detail-category">
          <button class="co-cat-head" type="button" onclick="this.parentElement.classList.toggle('open')">
            <span class="co-cat-icon">${cat.icon}</span>
            <span><b>${escCO(cat.name)}</b>${cat.mandatory?'<small>MANDATORY EVERY SERVICE DAY</small>':''}</span>
            <span class="co-chevron">⌄</span>
          </button>
          <div class="co-cat-body">
            ${cat.items.map(item => `
              <div class="co-detail-item">
                <div class="co-item-title">${escCO(item.name)}</div>
                ${item.description ? `<div class="co-item-desc">${escCO(item.description)}</div>` : ''}
                ${(item.subtasks||[]).map(st => `
                  <label class="co-detail-row">
                    <input type="checkbox" data-co-check="${escCO(String(st.id))}" onchange="CleaningOpsDetailed.toggle(this)">
                    <span>${escCO(st.name)}</span>
                  </label>
                `).join('')}
              </div>
            `).join('')}
          </div>
        </section>
      `).join('');
      this.restore();
      this.updateProgress();
    },
    toggle(el){
      const id=el.dataset.coCheck;
      try { localStorage.setItem(this.key(id), el.checked?'1':'0'); } catch(e){}
      el.closest('.co-detail-row')?.classList.toggle('done', el.checked);
      this.updateProgress();
    },
    updateProgress(){
      const boxes=[...document.querySelectorAll('#detailedChecklistHost [data-co-check]')];
      const done=boxes.filter(x=>x.checked).length;
      const total=boxes.length;
      const p=document.querySelector('#detailedProgress');
      if(p) p.textContent = total ? `${done} / ${total} completed` : '';
      const bar=document.querySelector('#detailedProgressBar');
      if(bar) bar.style.width = total ? `${Math.round(done/total*100)}%` : '0%';
    }
  };
  function escCO(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
  window.escCO=escCO;

  // Expose a simple hook that the existing app can call after loading Supabase.
  window.initDetailedChecklist = async function(restaurantId){
    const ok=await CO.load();
    if(ok) CO.render(restaurantId);
    return ok;
  };
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Add the detailed checklist below the first existing checklist container.
  const existing = document.querySelector('#checklist, .checklist, [data-section="checklist"]');

  // Try immediately; if the existing app creates Supabase client later,
  // a short retry catches it without changing the rest of the application.
  let tries=0;
  const timer=setInterval(async()=>{
    tries++;
    if(window.supabaseClient){

      const rid=window.currentRestaurant?.id || window.selectedRestaurant?.id || window.todayRestaurant?.id || null;

});

<script id="co-employee-db-js">
(function(){
  const E = {
    employees:[], assignments:[], restaurants:[],
    async load(){
      if(!window.supabaseClient) return;
      const sb=window.supabaseClient;
      const [p,a,r]=await Promise.all([
        sb.from('profiles').select('*').order('full_name'),
        sb.from('employee_assignments').select('*'),
        sb.from('restaurants').select('*').order('name')
      ]);
      if(p.error) throw p.error;
      this.employees=(p.data||[]).filter(x=>x.role==='employee');
      this.assignments=a.data||[];
      this.restaurants=r.data||[];
      this.render();
    },
    initials(n){
      return String(n||'Employee').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    },
    esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))},
    assignmentsFor(id){return this.assignments.filter(a=>a.employee_id===id)},
    restaurantName(id){return this.restaurants.find(r=>r.id===id)?.name||'Unassigned'},
    render(){
      let host=document.getElementById('coEmployeeDB');
      if(!host) return;
      const q=(document.getElementById('coEmployeeSearch')?.value||'').toLowerCase().trim();
      const list=this.employees.filter(e=>(e.full_name||'').toLowerCase().includes(q));
      host.querySelector('.co-emp-list').innerHTML=list.length?list.map(e=>{
        const as=this.assignmentsFor(e.id);
        const active=e.active!==false;
        return `<article class="co-emp-card">
          <div class="co-emp-top">
            <div class="co-avatar">${this.initials(e.full_name)}</div>
            <div><div class="co-emp-name">${this.esc(e.full_name||'Employee')}</div><div class="co-emp-meta">${this.esc(e.role||'employee')}</div></div>
            <span class="co-status ${active?'':'off'}">${active?'Active':'Inactive'}</span>
          </div>
          <div class="co-emp-stats">
            <div class="co-stat"><b>${as.length}</b><span>ASSIGNMENTS</span></div>
            <div class="co-stat"><b>${active?'ON':'OFF'}</b><span>ACCOUNT</span></div>
            <div class="co-stat"><b>—</b><span>HOURS</span></div>
          </div>
          <div class="co-emp-actions">
            <button class="primary" onclick="COEmployees.open('${e.id}')">View employee</button>
            <button onclick="COEmployees.toggleActive('${e.id}',${active})">${active?'Deactivate':'Activate'}</button>
          </div>
        </article>`;
      }).join(''):`<div class="co-emp-empty">No employees found.</div>`;
    },
    async open(id){
      const e=this.employees.find(x=>x.id===id); if(!e)return;
      const modal=document.getElementById('coEmpModal');
      modal.classList.add('open');
      document.getElementById('coEmpModalBody').innerHTML=`
        <div class="co-detail-grid">
          <div class="co-detail-box"><span>Name</span><b>${this.esc(e.full_name||'Employee')}</b></div>
          <div class="co-detail-box"><span>Status</span><b>${e.active!==false?'Active':'Inactive'}</b></div>
          <div class="co-detail-box"><span>Role</span><b>${this.esc(e.role||'employee')}</b></div>
          <div class="co-detail-box"><span>Member since</span><b>${e.created_at?new Date(e.created_at).toLocaleDateString():'—'}</b></div>
        </div>
        <div style="margin-top:15px;color:#f5ead6;font-size:11px;font-weight:700;letter-spacing:.08em">RESTAURANT ASSIGNMENTS</div>
        <div id="coEmpAssignments"></div>
        <div class="co-assign-row">
          <select id="coEmpRestaurantSelect"><option value="">Assign restaurant…</option>${this.restaurants.map(r=>`<option value="${r.id}">${this.esc(r.name)}</option>`).join('')}</select>
          <button onclick="COEmployees.assign('${id}')">Assign</button>
        </div>
        <div style="margin-top:15px;color:#8f98a8;font-size:10px;line-height:1.4">
          Employees create their own accounts. Managers can assign them to one or multiple restaurants here.
        </div>`;
      this.renderAssignments(id);
    },
    renderAssignments(id){
      const h=document.getElementById('coEmpAssignments'); if(!h)return;
      const as=this.assignmentsFor(id);
      h.innerHTML=as.length?as.map(a=>`<div class="co-assignment"><span>${this.esc(this.restaurantName(a.restaurant_id))}</span><button title="Remove" onclick="COEmployees.removeAssignment('${a.id}','${id}')">×</button></div>`).join(''):`<div style="padding:9px;color:#8f98a8;font-size:10px">No restaurant assignments yet.</div>`;
    },
    async assign(empId){
      const sel=document.getElementById('coEmpRestaurantSelect'), rid=sel?.value;
      if(!rid)return;
      const exists=this.assignments.some(a=>a.employee_id===empId&&a.restaurant_id===rid);
      if(exists){alert('Employee is already assigned to this restaurant.');return}
      const {data,error}=await window.supabaseClient.from('employee_assignments').insert({employee_id:empId,restaurant_id:rid}).select().single();
      if(error){alert(error.message);return}
      this.assignments.push(data); sel.value=''; this.renderAssignments(empId); this.render();
    },
    async removeAssignment(aid,empId){
      const {error}=await window.supabaseClient.from('employee_assignments').delete().eq('id',aid);
      if(error){alert(error.message);return}
      this.assignments=this.assignments.filter(a=>a.id!==aid); this.renderAssignments(empId); this.render();
    },
    async toggleActive(id,current){
      const {error}=await window.supabaseClient.from('profiles').update({active:!current}).eq('id',id);
      if(error){alert(error.message);return}
      const e=this.employees.find(x=>x.id===id); if(e)e.active=!current; this.render();
    }
  };
  window.COEmployees=E;

  function inject(){
    if(document.getElementById('coEmployeeDB')) return;
    const section=document.createElement('section');
    section.id='coEmployeeDB'; section.className='co-emp-db';
    section.innerHTML=`
      <div class="co-emp-head"><div><h2>EMPLOYEES</h2><p>Employee database & assignments</p></div></div>
      <input id="coEmployeeSearch" class="co-emp-search" placeholder="Search employees…" />
      <div class="co-emp-list"></div>`;
    // Prefer the manager area; otherwise append to main.
    const anchor=[...document.querySelectorAll('h1,h2,h3,button,a')].find(x=>/employee|empleado/i.test(x.textContent||''));
    (anchor?.closest('section,.card,.panel')?.parentElement||document.querySelector('main')||document.body).appendChild(section);
    const modal=document.createElement('div');
    modal.id='coEmpModal'; modal.className='co-emp-modal';
    modal.innerHTML=`<div class="co-emp-sheet">
      <div class="co-emp-sheet-head"><b>EMPLOYEE PROFILE</b><button class="co-close" onclick="document.getElementById('coEmpModal').classList.remove('open')">×</button></div>
      <div id="coEmpModalBody"></div>
    </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
    document.getElementById('coEmployeeSearch').addEventListener('input',()=>E.render());
  }

  async function start(){
    inject();
    let tries=0;
    const t=setInterval(async()=>{
      tries++;
      if(window.supabaseClient){
        clearInterval(t);
        try{await E.load()}catch(err){console.warn('Employee DB:',err)}
      }else if(tries>30)clearInterval(t);
    },500);
  }
  document.addEventListener('DOMContentLoaded',start);
})();
</script>

.v7-list{display:grid;gap:7px}
.v7-row{display:flex;align-items:center;gap:10px;background:var(--v7-panel);border:1px solid var(--v7-line);border-radius:12px;padding:10px}
.v7-dot{width:8px;height:8px;border-radius:50%;background:var(--v7-gold);flex:none}
.v7-row-main{min-width:0;flex:1}
.v7-row-title{font-size:12px;font-weight:700}
.v7-row-meta{font-size:9px;color:var(--v7-muted);margin-top:2px}
.v7-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.v7-action{background:var(--v7-panel2)!important;color:var(--v7-cream)!important;border:1px solid var(--v7-line)!important;border-radius:12px!important;min-height:45px!important;font-size:10px!important;text-align:left;padding:9px 11px!important}
.v7-action strong{display:block;font-size:11px}
.v7-action span{color:var(--v7-muted);font-size:8px}
.v7-empty{padding:18px;text-align:center;border:1px dashed var(--v7-line);border-radius:12px;color:var(--v7-muted);font-size:11px}
.v7-menu-panel{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);z-index:3000;background:#0e131d;border-left:1px solid rgba(212,174,76,.25);padding:18px;transform:translateX(105%);transition:transform .2s ease;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
.v7-menu-panel.open{transform:translateX(0)}
.v7-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.v7-menu-head b{font-size:12px;letter-spacing:.15em}
.v7-menu-close{background:transparent!important;color:var(--v7-cream)!important;border:0!important;font-size:22px!important;min-height:32px!important;width:32px!important}
.v7-menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--v7-panel)!important;color:var(--v7-cream)!important;border:1px solid var(--v7-line)!important;border-radius:11px!important;padding:11px!important;margin:6px 0!important;text-align:left}
.v7-menu-item small{color:var(--v7-muted)}
.v7-menu-item.danger{border-color:rgba(143,61,67,.45)!important;color:#e7b5b8!important}
.v7-manager-view,.v7-employee-view{display:none}
.v7-visible{display:block!important}
.v7-modal-bg{position:fixed;inset:0;z-index:2900;background:rgba(0,0,0,.68);display:none;align-items:flex-end}
.v7-modal-bg.open{display:flex}
.v7-sheet{width:100%;max-width:760px;margin:0 auto;max-height:88vh;overflow:auto;background:#0e131d;border-top:1px solid rgba(212,174,76,.25);border-radius:20px 20px 0 0;padding:16px}
.v7-form{display:grid;gap:8px}
.v7-form input,.v7-form select{width:100%;background:var(--v7-panel2)!important;color:var(--v7-cream)!important;border:1px solid var(--v7-line)!important;border-radius:10px!important;padding:10px!important}
.v7-primary{background:var(--v7-gold)!important;color:#080b12!important;border:0!important;font-weight:800}
.v7-secondary{background:var(--v7-panel2)!important;color:var(--v7-cream)!important;border:1px solid var(--v7-line)!important}
.v7-red{background:var(--v7-red2)!important;color:#f3d9da!important;border:1px solid rgba(143,61,67,.55)!important}
@media(max-width:420px){
 #co-v7-app{padding-left:12px;padding-right:12px}
 .v7-grid{gap:6px}.v7-card{padding:11px}.v7-card-value{font-size:18px}
 .v7-hero h1{font-size:22px!important}
}
</style>

<script id="co-v7-complete-js">
(function(){
 const V={
  sb:null, profile:null, employees:[], restaurants:[], assignments:[],
  async init(){
   if(!window.supabaseClient)return;
   this.sb=window.supabaseClient;
   try{
    const {data:{user}}=await this.sb.auth.getUser();
    if(!user)return;
    const {data:p}=await this.sb.from('profiles').select('*').eq('id',user.id).single();
    this.profile=p||{};
    const isManager=['manager','owner'].includes(this.profile.role);
    document.getElementById('v7Manager').classList.toggle('v7-visible',isManager);
    document.getElementById('v7Employee').classList.toggle('v7-visible',!isManager);
    if(isManager) await this.managerData(); else await this.employeeData();
    this.updateRole();
   }catch(e){console.warn('v7 init',e)}
  },
  updateRole(){
   const role=(this.profile?.role||'employee').toUpperCase();
   const r=document.getElementById('v7Role'); if(r)r.textContent=role;
   const n=document.getElementById('v7Name'); if(n)n.textContent=this.profile?.full_name||'Cleaning Ops';
  },
  async managerData(){
   const [e,r,a]=await Promise.all([
    this.sb.from('profiles').select('*').eq('role','employee').order('full_name'),
    this.sb.from('restaurants').select('*').order('name'),
    this.sb.from('employee_assignments').select('*')
   ]);
   this.employees=e.data||[];this.restaurants=r.data||[];this.assignments=a.data||[];
   this.renderManager();
  },
  async employeeData(){
   const {data:{user}}=await this.sb.auth.getUser();
   const {data:a}=await this.sb.from('employee_assignments').select('*, restaurants(*)').eq('employee_id',user.id);
   const box=document.getElementById('v7MyAssignments');
   const rows=a||[];
   box.innerHTML=rows.length?rows.map(x=>`<div class="v7-row"><div class="v7-dot"></div><div class="v7-row-main"><div class="v7-row-title">${this.esc(x.restaurants?.name||'Restaurant')}</div><div class="v7-row-meta">Assigned location</div></div></div>`).join(''):'<div class="v7-empty">No restaurant assignments yet.</div>';
  },
  renderManager(){
   const em=document.getElementById('v7EmployeeList'),rs=document.getElementById('v7RestaurantList');
   document.getElementById('v7EmployeeCount').textContent=this.employees.length;
   document.getElementById('v7RestaurantCount').textContent=this.restaurants.length;
   em.innerHTML=this.employees.length?this.employees.map(x=>{
    const n=this.assignments.filter(a=>a.employee_id===x.id).length;
    return `<button class="v7-row" style="width:100%;text-align:left" onclick="V7.openEmployee('${x.id}')"><div class="v7-dot"></div><div class="v7-row-main"><div class="v7-row-title">${this.esc(x.full_name||'Employee')}</div><div class="v7-row-meta">${n} restaurant assignment${n===1?'':'s'} · ${x.active===false?'Inactive':'Active'}</div></div><span>›</span></button>`;
   }).join(''):'<div class="v7-empty">No employees have signed up yet.</div>';
   rs.innerHTML=this.restaurants.length?this.restaurants.map(x=>`<button class="v7-row" style="width:100%;text-align:left" onclick="V7.openRestaurant('${x.id}')"><div class="v7-dot"></div><div class="v7-row-main"><div class="v7-row-title">${this.esc(x.name)}</div><div class="v7-row-meta">${this.esc(x.service_day||'')} ${this.esc(x.service_time||'')}</div></div><span>›</span></button>`).join(''):'<div class="v7-empty">No restaurants configured.</div>';
  },
  esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))},
  openEmployee(id){
   const e=this.employees.find(x=>x.id===id);if(!e)return;
   const as=this.assignments.filter(a=>a.employee_id===id);
   this.sheet(`<div class="v7-menu-head"><b>EMPLOYEE PROFILE</b><button class="v7-menu-close" onclick="V7.closeSheet()">×</button></div>
   <div class="v7-grid"><div class="v7-card"><div class="v7-card-label">Name</div><div class="v7-card-value" style="font-size:16px">${this.esc(e.full_name)}</div></div><div class="v7-card"><div class="v7-card-label">Status</div><div class="v7-card-value" style="font-size:16px">${e.active===false?'Inactive':'Active'}</div></div></div>
   <div class="v7-section"><div class="v7-section-head"><h2>RESTAURANT ASSIGNMENTS</h2></div><div class="v7-list">${as.length?as.map(a=>`<div class="v7-row"><div class="v7-row-main"><div class="v7-row-title">${this.esc(this.restaurants.find(r=>r.id===a.restaurant_id)?.name||'Restaurant')}</div></div><button class="v7-link" onclick="V7.removeAssignment('${a.id}','${id}')">Remove</button></div>`).join(''):'<div class="v7-empty">No assignments.</div>'}</div>
   <div class="v7-form" style="margin-top:10px"><select id="v7AssignRestaurant"><option value="">Assign restaurant…</option>${this.restaurants.map(r=>`<option value="${r.id}">${this.esc(r.name)}</option>`).join('')}</select><button class="v7-primary" onclick="V7.assign('${id}')">Assign Restaurant</button></div></div>
   <div class="v7-section"><div class="v7-actions"><button class="v7-action" onclick="V7.toggleActive('${id}',${e.active!==false})"><strong>${e.active===false?'Activate':'Deactivate'}</strong><span>Account status</span></button><button class="v7-action" onclick="alert('Work history will appear here as time entries and completed jobs are recorded.')"><strong>Work History</strong><span>Hours & completed jobs</span></button><button class="v7-action" onclick="alert('Photos will appear here as employees upload job photos.')"><strong>Job Photos</strong><span>Before & after</span></button><button class="v7-action" onclick="alert('Checklist history will appear here as jobs are completed.')"><strong>Checklist History</strong><span>Completed work</span></button></div></div>`);
  },
  openRestaurant(id){
   const r=this.restaurants.find(x=>x.id===id);if(!r)return;
   this.sheet(`<div class="v7-menu-head"><b>RESTAURANT</b><button class="v7-menu-close" onclick="V7.closeSheet()">×</button></div>
   <div class="v7-form"><label>Name<input id="v7RName" value="${this.esc(r.name)}"></label><label>Service day<input id="v7RDay" value="${this.esc(r.service_day||'')}"></label><label>Service time<input id="v7RTime" value="${this.esc(r.service_time||'')}"></label><button class="v7-primary" onclick="V7.saveRestaurant('${id}')">Save Changes</button></div>
   <div class="v7-section"><div class="v7-actions"><button class="v7-action" onclick="alert('Checklist configuration is connected to the detailed checklist tables. The full configuration editor is the next manager control.')"><strong>Checklist Setup</strong><span>Equipment & rotations</span></button><button class="v7-action" onclick="alert('Bathroom configuration is connected to restaurant_bathrooms.')"><strong>Bathrooms</strong><span>Fixtures & required service</span></button></div></div>`);
  },
  async saveRestaurant(id){
   const patch={name:document.getElementById('v7RName').value.trim(),service_day:document.getElementById('v7RDay').value.trim(),service_time:document.getElementById('v7RTime').value.trim()};
   const {error}=await this.sb.from('restaurants').update(patch).eq('id',id);
   if(error){alert(error.message);return} await this.managerData();this.closeSheet();
  },
  async assign(empId){
   const rid=document.getElementById('v7AssignRestaurant')?.value;if(!rid)return;
   if(this.assignments.some(a=>a.employee_id===empId&&a.restaurant_id===rid)){alert('Already assigned.');return}
   const {data,error}=await this.sb.from('employee_assignments').insert({employee_id:empId,restaurant_id:rid}).select().single();
   if(error){alert(error.message);return}this.assignments.push(data);this.openEmployee(empId);this.renderManager();
  },
  async removeAssignment(aid,empId){
   const {error}=await this.sb.from('employee_assignments').delete().eq('id',aid);
   if(error){alert(error.message);return}this.assignments=this.assignments.filter(a=>a.id!==aid);this.openEmployee(empId);this.renderManager();
  },
  async toggleActive(id,current){
   const {error}=await this.sb.from('profiles').update({active:!current}).eq('id',id);
   if(error){alert(error.message);return}await this.managerData();this.closeSheet();
  },
  sheet(content){const s=document.getElementById('v7Sheet');document.getElementById('v7SheetContent').innerHTML=content;s.classList.add('open')},
  closeSheet(){document.getElementById('v7Sheet').classList.remove('open')}
 };
 window.V7=V;
 function build(){
  if(document.getElementById('co-v7-app'))return;
  const app=document.createElement('div');app.id='co-v7-app';
  app.innerHTML=`
   <header class="v7-header"><div><div class="v7-title">CLEANING OPS</div><div class="v7-sub"><span id="v7Name">OPERATIONS</span> · <span id="v7Role">EMPLOYEE</span></div></div>
   <button class="v7-menu" id="v7MenuBtn" aria-label="Menu"><span></span><span></span><span></span></button></header>
   <div id="v7Manager" class="v7-manager-view">
    <div class="v7-hero"><div class="v7-eyebrow">MANAGEMENT</div><h1>Operations Dashboard</h1></div>
    <div class="v7-grid"><div class="v7-card gold"><div class="v7-card-label">Employees</div><div class="v7-card-value" id="v7EmployeeCount">0</div></div><div class="v7-card red"><div class="v7-card-label">Restaurants</div><div class="v7-card-value" id="v7RestaurantCount">0</div></div></div>
    <div class="v7-section"><div class="v7-section-head"><h2>QUICK ACTIONS</h2></div><div class="v7-actions"><button class="v7-action" onclick="V7.showEmployees()"><strong>Employees</strong><span>Manage people & assignments</span></button><button class="v7-action" onclick="V7.showRestaurants()"><strong>Restaurants</strong><span>Edit locations & schedules</span></button><button class="v7-action" onclick="V7.showChecklist()"><strong>Checklist</strong><span>Tasks & rotations</span></button><button class="v7-action" onclick="alert('Reports will use recorded jobs, time entries, photos and signatures.')"><strong>Reports</strong><span>Work & completion</span></button></div></div>
    <div class="v7-section"><div class="v7-section-head"><h2>EMPLOYEES</h2><button class="v7-link" onclick="V7.showEmployees()">VIEW ALL</button></div><div id="v7EmployeeList" class="v7-list"></div></div>
    <div class="v7-section"><div class="v7-section-head"><h2>RESTAURANTS</h2><button class="v7-link" onclick="V7.showRestaurants()">VIEW ALL</button></div><div id="v7RestaurantList" class="v7-list"></div></div>
   </div>
   <div id="v7Employee" class="v7-employee-view">
    <div class="v7-hero"><div class="v7-eyebrow">MY WORK</div><h1>Today's Operations</h1></div>
    <div class="v7-section"><div class="v7-section-head"><h2>MY RESTAURANTS</h2></div><div id="v7MyAssignments" class="v7-list"></div></div>
    <div class="v7-section"><div class="v7-actions"><button class="v7-action" onclick="alert('Clock in is handled by the existing time-entry workflow.')"><strong>Clock In</strong><span>Start today's service</span></button><button class="v7-action" onclick="alert('Your detailed checklist is ready in the cleaning workflow.')"><strong>Checklist</strong><span>Complete cleaning tasks</span></button><button class="v7-action" onclick="alert('Use the existing photo workflow to upload before/after photos.')"><strong>Photos</strong><span>Before & after</span></button><button class="v7-action" onclick="alert('Signature appears when the job is ready to complete.')"><strong>Complete</strong><span>Sign & clock out</span></button></div></div>
   </div>
  `;
  document.body.prepend(app);
  const panel=document.createElement('aside');panel.id='v7MenuPanel';panel.className='v7-menu-panel';
  panel.innerHTML=`<div class="v7-menu-head"><b>MENU</b><button class="v7-menu-close" id="v7Close">×</button></div>
   <button class="v7-menu-item" onclick="V7.showDashboard()">Dashboard <small>Home</small></button>
   <button class="v7-menu-item" onclick="V7.showEmployees()">Employees <small>Manage</small></button>
   <button class="v7-menu-item" onclick="V7.showRestaurants()">Restaurants <small>Manage</small></button>
   <button class="v7-menu-item" onclick="V7.showChecklist()">Checklist <small>Configure</small></button>
   <button class="v7-menu-item" onclick="alert('Settings: language, account and logout are available here.')">Settings <small>Account</small></button>
   <button class="v7-menu-item danger" onclick="V7.logout()">Log out</button>`;
  document.body.appendChild(panel);
  const sheet=document.createElement('div');sheet.id='v7Sheet';sheet.className='v7-modal-bg';sheet.innerHTML='<div class="v7-sheet" id="v7SheetContent"></div>';document.body.appendChild(sheet);
  sheet.addEventListener('click',e=>{if(e.target===sheet)V7.closeSheet()});
  document.getElementById('v7MenuBtn').onclick=()=>panel.classList.add('open');
  document.getElementById('v7Close').onclick=()=>panel.classList.remove('open');
 }
 V.showDashboard=function(){document.getElementById('v7MenuPanel').classList.remove('open');document.getElementById('v7Manager').classList.toggle('v7-visible',['manager','owner'].includes(this.profile?.role));document.getElementById('v7Employee').classList.toggle('v7-visible',!['manager','owner'].includes(this.profile?.role));};
 V.showEmployees=function(){this.closeSheet();this.sheet(`<div class="v7-menu-head"><b>EMPLOYEE DATABASE</b><button class="v7-menu-close" onclick="V7.closeSheet()">×</button></div><input class="v7-search" style="width:100%;background:#151c29;color:#f5ead6;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px" placeholder="Search employees…" oninput="V7.filterEmployees(this.value)"><div id="v7AllEmployees" class="v7-list" style="margin-top:9px"></div>`);this.renderAllEmployees();};
 V.filterEmployees=function(q){const box=document.getElementById('v7AllEmployees');const list=this.employees.filter(e=>(e.full_name||'').toLowerCase().includes((q||'').toLowerCase()));box.innerHTML=list.map(e=>`<button class="v7-row" style="width:100%;text-align:left" onclick="V7.openEmployee('${e.id}')"><div class="v7-dot"></div><div class="v7-row-main"><div class="v7-row-title">${this.esc(e.full_name)}</div><div class="v7-row-meta">${e.active===false?'Inactive':'Active'}</div></div><span>›</span></button>`).join('')||'<div class="v7-empty">No employees found.</div>';};
 V.renderAllEmployees=function(){this.filterEmployees('')};
 V.showRestaurants=function(){this.sheet(`<div class="v7-menu-head"><b>RESTAURANT DATABASE</b><button class="v7-menu-close" onclick="V7.closeSheet()">×</button></div><div class="v7-list">${this.restaurants.map(r=>`<button class="v7-row" style="width:100%;text-align:left" onclick="V7.openRestaurant('${r.id}')"><div class="v7-dot"></div><div class="v7-row-main"><div class="v7-row-title">${this.esc(r.name)}</div><div class="v7-row-meta">${this.esc(r.service_day||'')} ${this.esc(r.service_time||'')}</div></div><span>›</span></button>`).join('')}</div>`)};
 V.showChecklist=function(){this.sheet(`<div class="v7-menu-head"><b>CHECKLIST MANAGEMENT</b><button class="v7-menu-close" onclick="V7.closeSheet()">×</button></div><div class="v7-empty">Detailed checklist data is connected to Supabase. Restaurant-specific equipment, required items, rotations and mandatory bathrooms will be managed here next.</div>`)};
 V.logout=async function(){if(this.sb)await this.sb.auth.signOut();location.reload()};
 document.addEventListener('DOMContentLoaded',()=>{build();let n=0;const t=setInterval(()=>{n++;if(window.supabaseClient){clearInterval(t);V.init()}if(n>30)clearInterval(t)},500)});
})();
</script>

</body></html>
